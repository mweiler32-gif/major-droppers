<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DINGERS ONLY 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --green-dark: #1a3a0e;
    --green-mid: #2d5a1b;
    --green-light: #4a9a30;
    --brown: #8b5a2b;
    --brown-light: #c4894a;
    --brown-dark: #5c3a1a;
    --cream: #fdf5e4;
    --cream-dim: #c8b896;
    --red: #c41e3a;
    --blue: #1b3a6b;
    --blue-light: #2a5298;
    --white: #ffffff;
    --gold: #d4a017;
    --card-bg: rgba(0,0,0,0.25);
    --card-border: rgba(255,255,255,0.12);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background: var(--green-dark);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0,0,0,0.08) 60px, rgba(0,0,0,0.08) 61px),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,0,0,0.05) 60px, rgba(0,0,0,0.05) 61px),
      linear-gradient(180deg, #1e3d10 0%, #2d5a1b 40%, #1e3d10 100%);
    min-height:100vh; color:var(--cream); font-family:'Barlow',sans-serif;
  }
  header {
    text-align:center; padding:28px 20px 18px;
    background:linear-gradient(180deg, var(--blue) 0%, var(--blue-light) 100%);
    border-bottom:4px solid var(--red); position:relative;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
  header::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,0.02) 10px,rgba(255,255,255,0.02) 20px); pointer-events:none; }
  header::after { content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:200px; height:3px; background:var(--gold); }
  .title { font-family:'Bebas Neue',sans-serif; font-size:clamp(48px,8vw,82px); letter-spacing:8px; line-height:1; color:var(--white); text-shadow:3px 3px 0 var(--red),6px 6px 0 rgba(0,0,0,0.3); }
  .subtitle { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:8px; color:var(--gold); margin-top:4px; }
  nav { display:flex; justify-content:center; gap:3px; padding:10px 16px; background:var(--brown-dark); border-bottom:3px solid var(--brown); flex-wrap:wrap; }
  .nav-btn { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; background:transparent; border:1px solid rgba(255,255,255,0.15); color:var(--cream-dim); padding:6px 16px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .nav-btn:hover { color:var(--cream); border-color:var(--gold); background:rgba(255,255,255,0.08); }
  .nav-btn.active { background:var(--red); color:var(--white); border-color:var(--red); }
  /* RACE TOGGLE */
  .race-tabs { display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap; }
  .race-btn { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.12); color:var(--cream-dim); padding:7px 18px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .race-btn:hover { color:var(--cream); border-color:rgba(255,255,255,0.28); }
  .race-btn.active { background:var(--gold); color:var(--green-dark); border-color:var(--gold); }
  .race-sub { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--cream-dim); letter-spacing:1px; margin-bottom:12px; }
  .split-hr { display:flex; align-items:baseline; justify-content:flex-end; gap:8px; }
  .split-num { font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--cream-dim); }
  .split-num b { color:var(--white); }
  .swap-note { font-family:'Barlow Condensed',sans-serif; font-size:10px; color:var(--brown-light); letter-spacing:0.5px; margin-left:4px; }
  .warn-banner { background:rgba(196,30,58,0.1); border:1px solid rgba(196,30,58,0.35); border-radius:3px; padding:8px 12px; margin-bottom:12px; font-family:'Barlow Condensed',sans-serif; font-size:12px; color:#ff8095; letter-spacing:0.5px; }
  main { max-width:1120px; margin:0 auto; padding:20px 12px 80px; }
  .panel { display:none; animation:fadeIn 0.2s ease; }
  .panel.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .sec-hd { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:4px; color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:10px; text-shadow:1px 1px 0 rgba(0,0,0,0.5); }
  .sec-hd::after { content:''; flex:1; height:1px; background:linear-gradient(to right,rgba(212,160,23,0.4),transparent); }
  .refresh-row { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:12px; }
  .refresh-btn { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--cream-dim); padding:5px 12px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .refresh-btn:hover { border-color:var(--gold); color:var(--gold); }
  .upd-txt { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:rgba(255,255,255,0.18); letter-spacing:1px; }

  /* STANDINGS */
  .stand-wrap { display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
  .stand-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:3px; padding:14px 18px; position:relative; overflow:hidden; transition:border-color 0.2s; }
  .stand-card:hover { border-color:rgba(212,160,23,0.2); }
  .stand-card.first { border-color:var(--gold); background:rgba(212,160,23,0.08); }
  .stand-card.first::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); }
  .stand-top { display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:14px; margin-bottom:10px; }
  .rank-n { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--cream-dim); text-align:center; }
  .first .rank-n { color:var(--gold); font-size:32px; }
  .mgr-name { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; }
  .mgr-sub { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--cream-dim); letter-spacing:1px; margin-top:1px; }
  .hr-big { font-family:'Bebas Neue',sans-serif; font-size:34px; color:var(--white); text-align:right; line-height:1; }
  .hr-lbl { font-family:'Barlow Condensed',sans-serif; font-size:9px; color:var(--cream-dim); letter-spacing:2px; text-align:right; }
  .stand-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; }
  .stat-box { text-align:center; padding:0 8px; border-right:1px solid rgba(255,255,255,0.05); }
  .stat-box:last-child { border-right:none; }
  .stat-val { font-family:'Bebas Neue',sans-serif; font-size:20px; }
  .stat-lbl { font-family:'Barlow Condensed',sans-serif; font-size:10px; color:var(--cream-dim); letter-spacing:1px; }
  .pace-good { color:#5dcc80; }
  .pace-bad { color:var(--red); }
  .bar-bg { height:3px; background:rgba(255,255,255,0.07); border-radius:2px; overflow:hidden; margin-top:8px; grid-column:1/-1; }
  .bar-fill { height:100%; background:linear-gradient(to right,var(--red),#e63e5a); transition:width 1s ease; }

  /* ROSTER */
  .mgr-tabs { display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap; }
  .tab-btn { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.09); color:var(--cream-dim); padding:5px 12px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .tab-btn:hover { color:var(--cream); border-color:rgba(255,255,255,0.2); }
  .tab-btn.active { background:var(--blue); border-color:var(--gold); color:var(--gold); }

  /* ROSTER TABLE */
  .roster-tbl { width:100%; border-collapse:collapse; }
  .roster-tbl thead tr { border-bottom:2px solid rgba(255,255,255,0.1); }
  .roster-tbl th { font-family:'Barlow Condensed',sans-serif; font-size:10px; letter-spacing:2px; color:var(--cream-dim); text-align:left; padding:6px 10px; }
  .roster-tbl th.center { text-align:center; }
  .roster-tbl tbody tr { border-bottom:1px solid rgba(255,255,255,0.05); transition:background 0.1s; }
  .roster-tbl tbody tr:hover { background:rgba(255,255,255,0.025); }
  .roster-tbl td { padding:0; vertical-align:top; }
  .pos-pill { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; background:rgba(255,255,255,0.08); color:var(--cream-dim); padding:2px 5px; border-radius:2px; margin-right:5px; min-width:24px; text-align:center; }
  .ir-pill { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:9px; font-weight:700; letter-spacing:1px; background:rgba(196,30,58,0.2); color:var(--red); border:1px solid rgba(196,30,58,0.3); padding:1px 5px; border-radius:2px; margin-left:4px; }
  .rep-pill { display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:9px; font-weight:700; letter-spacing:1px; background:rgba(93,204,128,0.15); color:#5dcc80; border:1px solid rgba(93,204,128,0.3); padding:1px 5px; border-radius:2px; margin-left:4px; }

  /* PLAYER CELL */
  .player-cell { padding:10px 10px 8px; }
  .player-name-row { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .player-name { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--red); display:inline-block; flex-shrink:0; animation:livepulse 1s infinite; }

  /* TODAY'S GAME INFO - inline under player name */
  .today-game-info { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .today-time { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--cream-dim); letter-spacing:0.5px; }
  .today-score { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--cream-dim); }
  .today-inning { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--red); font-weight:700; letter-spacing:0.5px; }
  .today-stats { display:flex; gap:6px; }
  .today-stat { font-family:'Barlow Condensed',sans-serif; font-size:11px; }
  .today-stat-val { font-family:'Bebas Neue',sans-serif; font-size:14px; }
  .today-stat-val.hr-today { color:var(--red); }
  .today-off { font-family:'Barlow Condensed',sans-serif; font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:0.5px; }

  /* STAT CELLS */
  .hr-cell { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--brown-light); text-align:center; padding:10px 10px; }
  .pace-cell { font-family:'Bebas Neue',sans-serif; font-size:16px; text-align:center; padding:10px 10px; }
  .action-cell { text-align:center; padding:10px 10px; }
  .btn-sm { font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; border:none; padding:4px 8px; cursor:pointer; border-radius:2px; transition:all 0.12s; }
  .btn-ir { background:rgba(196,30,58,0.18); color:var(--red); border:1px solid rgba(196,30,58,0.3); }
  .btn-ir:hover { background:rgba(196,30,58,0.35); }
  .btn-restore { background:rgba(93,204,128,0.15); color:#5dcc80; border:1px solid rgba(93,204,128,0.3); }
  .btn-restore:hover { background:rgba(93,204,128,0.3); }
  .roster-footer { font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--cream-dim); text-align:right; margin-top:6px; }

  /* ACTIVITY */
  .act-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-bottom:24px; }
  .act-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:3px; padding:12px 14px; text-align:center; }
  .act-mgr { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; color:var(--cream-dim); }
  .act-player { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; margin:3px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .act-hr { font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--brown-light); line-height:1; }
  .act-pos { font-family:'Barlow Condensed',sans-serif; font-size:10px; color:var(--cream-dim); letter-spacing:1px; }

  /* SPLITS */
  .splits-tbl { width:100%; border-collapse:collapse; font-family:'Barlow Condensed',sans-serif; }
  .splits-tbl th { font-size:10px; letter-spacing:2px; color:var(--cream-dim); padding:6px 10px; border-bottom:1px solid rgba(255,255,255,0.07); text-align:left; }
  .splits-tbl th:not(:first-child) { text-align:center; }
  .splits-tbl td { padding:8px 10px; font-size:13px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .splits-tbl td:not(:first-child) { text-align:center; }
  .splits-tbl tr:hover td { background:rgba(255,255,255,0.02); }
  .split-val { font-family:'Bebas Neue',sans-serif; font-size:18px; }
  .split-mgr { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px; }

  /* SLOT SWAP CHAIN */
  .stint-chain { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:3px 0 2px; font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--cream-dim); }
  .stint { white-space:nowrap; }
  .stint b { color:var(--brown-light); font-family:'Bebas Neue',sans-serif; font-size:14px; margin-left:2px; }
  .stint-active { color:var(--cream); }
  .stint-active b { color:var(--red); }
  .stint-win { opacity:0.65; font-size:10px; }
  .stint-arrow { opacity:0.5; }
  .stint-lock { margin-left:4px; font-size:9px; letter-spacing:1px; text-transform:uppercase; opacity:0.55; border:1px solid rgba(255,255,255,0.15); border-radius:2px; padding:0 4px; }
  .btn-locked { display:inline-block; background:rgba(255,255,255,0.05); color:var(--cream-dim); border:1px solid rgba(255,255,255,0.12); cursor:default; }
  .modal-label { display:block; font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--cream-dim); margin:8px 0 3px; }
  .modal-err { font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--red); min-height:16px; margin-top:6px; }

  /* IR SECTION */
  .ir-section { background:rgba(196,30,58,0.06); border:1px solid rgba(196,30,58,0.2); border-radius:4px; padding:14px 16px; margin-top:6px; }
  .ir-section h4 { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; color:var(--red); margin-bottom:10px; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#1b3a6b; border:1px solid rgba(212,160,23,0.25); border-radius:6px; padding:24px; min-width:300px; max-width:460px; width:94%; }
  .modal-box h3 { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; color:var(--gold); margin-bottom:6px; }
  .modal-box p { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--cream-dim); margin-bottom:14px; line-height:1.5; }
  .modal-input { width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.12); color:var(--cream); font-family:'Barlow Condensed',sans-serif; font-size:14px; padding:9px 12px; border-radius:2px; outline:none; margin-bottom:10px; }
  .modal-input:focus { border-color:var(--gold); }
  .modal-btns { display:flex; gap:8px; }
  .btn-primary { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; background:var(--red); border:none; color:var(--white); padding:10px 24px; cursor:pointer; border-radius:2px; transition:background 0.15s; }
  .btn-primary:hover { background:#a01830; }
  .btn-ghost { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.15); color:var(--cream-dim); padding:8px 14px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .btn-ghost:hover { border-color:var(--cream); color:var(--cream); }

  .empty-msg { text-align:center; padding:40px; }
  .empty-msg strong { display:block; font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--gold); letter-spacing:3px; margin-bottom:6px; }
  .empty-msg span { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--cream-dim); }
  .loading-pulse { text-align:center; padding:28px; font-family:'Barlow Condensed',sans-serif; font-size:12px; letter-spacing:2px; color:var(--cream-dim); animation:pulse 1.5s infinite; }

  @media(max-width:600px) {
    .stand-stats { grid-template-columns:repeat(2,1fr); }
    .stand-top { grid-template-columns:36px 1fr auto; }
  }
</style>
</head>
<body>
<header>
  <div class="title">DINGERS ONLY</div>
  <div class="subtitle">2026 · MLB Home Run League</div>
</header>
<nav>
  <button class="nav-btn active" onclick="showPanel('standings',this)">Standings</button>
  <button class="nav-btn" onclick="showPanel('roster',this)">Rosters</button>
  <button class="nav-btn" onclick="showPanel('activity',this)">Top Dingers</button>
  <button class="nav-btn" onclick="showPanel('splits',this)">7/14/30 Splits</button>
</nav>
<main>
  <div id="panel-standings" class="panel active">
    <div class="refresh-row">
      <span class="upd-txt" id="upd-txt">Not yet refreshed</span>
      <button class="refresh-btn" onclick="loadLive(true);loadTodayGames(true).then(()=>{renderTodaysDingers();renderYesterdaysDingers();})">⟳ Refresh</button>
    </div>
    <div class="sec-hd" id="standings-hd">Standings</div>
    <div class="race-tabs" id="race-tabs">
      <button class="race-btn" onclick="setRace('h1',this)">First Half</button>
      <button class="race-btn" onclick="setRace('h2',this)">Second Half</button>
      <button class="race-btn active" onclick="setRace('total',this)">Total</button>
    </div>
    <div class="race-sub" id="race-sub"></div>
    <div id="resolve-warn"></div>
    <div id="standings-wrap"><div class="loading-pulse">LOADING...</div></div>
    <div class="sec-hd" style="margin-top:28px">Today's Dingers</div>
    <div id="todays-dingers"><div class="loading-pulse">LOADING...</div></div>
    <div class="sec-hd" style="margin-top:28px">Yesterday's Dingers</div>
    <div id="yesterdays-dingers"><div class="loading-pulse">LOADING...</div></div>
  </div>
  <div id="panel-roster" class="panel">
    <div class="refresh-row">
      <span class="upd-txt" id="roster-upd-txt"></span>
      <span id="live-indicator" style="display:none;font-family:Barlow Condensed,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--red);animation:livepulse 1s infinite;margin-right:8px">● GAMES LIVE</span>
      <button class="refresh-btn" onclick="refreshRoster()">⟳ Refresh</button>
    </div>
    <div class="sec-hd">Rosters</div>
    <div class="mgr-tabs" id="roster-tabs"></div>
    <div id="roster-body"></div>
  </div>
  <div id="panel-activity" class="panel">
    <div class="sec-hd">Top Dingers</div>
    <div id="activity-body"></div>
  </div>
  <div id="panel-splits" class="panel">
    <div class="sec-hd">HR Splits</div>
    <div id="splits-body"></div>
  </div>
</main>

<!-- IR Modal -->
<div class="modal-overlay" id="ir-modal">
  <div class="modal-box">
    <h3 id="ir-modal-title">PLACE ON IR</h3>
    <p id="ir-modal-sub"></p>
    <input class="modal-input" id="ir-rep-name" type="text" placeholder="Incoming player's full name" />
    <label class="modal-label" for="ir-swap-date">First day the new guy counts for this slot</label>
    <input class="modal-input" id="ir-swap-date" type="date" />
    <div class="modal-err" id="ir-modal-err"></div>
    <div class="modal-btns">
      <button class="btn-primary" id="ir-confirm-btn" onclick="confirmIR()">CONFIRM</button>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── SEASON CONFIG ─────────────────────────────────────────
const SEASON_START = new Date('2026-03-25');
const SEASON_END   = new Date('2026-09-27');
const SEASON_DAYS  = Math.round((SEASON_END - SEASON_START) / 86400000);

// ── ALL-STAR BREAK / HALF SPLIT ───────────────────────────
// First half = season start through the last day before the 2026 ASG (played 7/14).
// Second half = 7/15 onward (games resume ~7/17). These windows are queried
// directly from the MLB Stats API so every manager/device sees identical frozen
// first-half numbers with no shared database required.

function dayOfSeason() {
  return Math.max(1, Math.min(Math.round((new Date() - SEASON_START) / 86400000), SEASON_DAYS));
}
function projectedFinal(hr) {
  return Math.round((hr / dayOfSeason()) * SEASON_DAYS);

function todayStr() {
  // Baseball day rolls over at 2am local time
  // If it's before 2am, treat it as yesterday's date
  const now = new Date();
  if (now.getHours() < 2) {
    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    return yesterday.toISOString().split('T')[0].slice(0,10);
  }
  // Use local date, not UTC
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function dateStr(daysAgo) {
  // Use same 2am baseball day rollover as todayStr()
  const now = new Date();
  const base = new Date(now);
  if (now.getHours() < 2) {
    base.setDate(base.getDate() - 1); // before 2am = still yesterday's baseball day
  }
  base.setDate(base.getDate() - daysAgo);
  const y = base.getFullYear();
  const m = String(base.getMonth()+1).padStart(2,'0');
  const d = String(base.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

// ── IR / IN-SEASON SWAPS (SECOND HALF ONLY) ───────────────
// A slot is scored as a POSITION, not a player: its second-half HR total is the
// sum of each occupant's HRs during the window he actually held the slot. A guy
// who leaves keeps what he hit while he was in; he can never add to it again.
// A guy who arrives counts only from his start date forward.
//
// Shape: SEED_IR[MANAGER][POS] = [ {player, to}, {player, from}, ... ]
//   - the first stint's `from` defaults to SECOND_HALF_START
//   - the last stint's `to` defaults to today (open window)
//   - dates are YYYY-MM-DD and are INCLUSIVE on both ends, so the incoming
//     player's `from` is the DAY AFTER the outgoing player's `to`. Give one or
//     the other and the missing side is derived; never both off by a day.
//
// Every window below is queried live from the MLB API, so there are no frozen
// numbers to go stale and nothing to re-enter by hand. Seeded entries here are
// baked into the file, so every manager on every device sees the same slot.
const SEED_IR = {
  // Casey Schmitt to the IL. His LF HRs from 7/15 through 8/30 stay on Roberts'
  // board and stop growing; Chourio counts for the slot from 8/31 forward only.
  ROBERTS: { LF: [ { player:'Casey Schmitt',    to:'2026-08-30' },
                   { player:'Jackson Chourio',  from:'2026-08-31' } ] },

  // Example — WEILER's 3B slot: Caminero through 8/24, Mayo from 8/25 on.
  // WEILER: { '3B': [ { player:'Junior Caminero', to:'2026-08-24' },
  //                   { player:'Coby Mayo',       from:'2026-08-25' } ] },
};

// Normalize a slot into a full stint list with every from/to filled in.
// Plain slots (no IR) come back as a single open stint — identical to the old
// behavior, so nothing changes for the 41 slots that never moved.
// '2026-08-31' -> '8/31' for compact window labels.
function fmtMD(ymd) {

  const [, m, d] = ymd.split('-');

function shiftDay(ymd, n) {
  const [y,m,d] = ymd.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d + n));
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`;
}
function slotStints(mgr, pos) {
  const seeded = SEED_IR[mgr] && SEED_IR[mgr][pos];
  let local = null; try { local = S.ir && S.ir[mgr] && S.ir[mgr][pos]; } catch(e) {}  // S may still be in TDZ during module init
  const raw = seeded || local;
  if (!raw || !Array.isArray(raw) || !raw.length) {
    return [{ player: SECOND_HALF_ROSTERS[mgr][pos], from: SECOND_HALF_START, to: null, seeded: !!seeded }];
  }
  return raw.map((s, i) => ({
    player: s.player,
    from: s.from || (i === 0
            ? SECOND_HALF_START
            : (raw[i-1].to ? shiftDay(raw[i-1].to, 1) : SECOND_HALF_START)),
    to:   (i === raw.length - 1)
            ? (s.to || null)
            : (s.to || (raw[i+1].from ? shiftDay(raw[i+1].from, -1) : null)),
    seeded: !!seeded,
  }));
}

function slotIsSeeded(mgr, pos)  { return !!(SEED_IR[mgr] && SEED_IR[mgr][pos]); }

}
// Clip a slot's stints to an arbitrary [ws, we] window (YYYY-MM-DD sorts lexically).
function clampStints(mgr, pos, ws, we) {
  return slotStints(mgr, pos).map(s => {
    const from = s.from > ws ? s.from : ws;
    const to   = (s.to || we) < we ? (s.to || we) : we;
    return from <= to ? { player: s.player, from, to } : null;
  }).filter(Boolean);
}

function mkState() { return { ir: Object.fromEntries(MANAGERS.map(m=>[m,{}])) }; }
// Old saved IR entries were a single {originalPlayer, replacement, repStartDate, ...}
// object per slot. Convert them to the stint list so nobody's existing browser
// state silently disappears on first load of this version.
function migrateState(st) {
  if (!st || !st.ir) return mkState();
  MANAGERS.forEach(m => {
    if (!st.ir[m]) { st.ir[m] = {}; return; }
    Object.keys(st.ir[m]).forEach(pos => {
      const v = st.ir[m][pos];
      if (Array.isArray(v)) return;                       // already migrated
      if (!v || typeof v !== 'object') { delete st.ir[m][pos]; return; }
      const start = v.repStartDate || todayStr();
      const out = [{ player: v.originalPlayer || SECOND_HALF_ROSTERS[m][pos], to: shiftDay(start, -1) }];
      if (v.replacement) out.push({ player: v.replacement, from: start });
      st.ir[m][pos] = out;
    });
  });
  return st;
}

// ── AUTO PLAYER-ID RESOLUTION ─────────────────────────────
// Resolves every rostered name to its MLB player ID and current team ID from the
// full 2026 player list, so new roster additions work without editing any table.
// The hand-verified PLAYER_IDS / PLAYER_TEAM_IDS below act as overrides for any
// tricky/duplicate names.
let autoIdMap = {};        // normName(fullName) -> playerId
let autoTeamMap = {};      // normName(fullName) -> teamId
let lastNameIndex = {};    // normName(lastName) -> [{id, teamId, full}]
let ROSTER_IDS = {};       // normName(rosterName) -> playerId  (players we actually fetch)
let unresolvedPlayers = []; // roster names we could not map to an ID
let playerIndexReady = false;

async function buildPlayerIndex() {
  try {
    const r = await fetch('https://statsapi.mlb.com/api/v1/sports/1/players?season=2026');
    if (!r.ok) { console.error('Player index failed:', r.status); return; }
    const d = await r.json();
    const people = d?.people || [];
    autoIdMap = {}; autoTeamMap = {}; lastNameIndex = {};
    people.forEach(p => {
      const id = p.id;
      const teamId = p.currentTeam?.id ?? null;
      const key = normName(p.fullName || '');
      if (!key) return;
      if (autoIdMap[key] === undefined) autoIdMap[key] = id;
      if (teamId != null && autoTeamMap[key] === undefined) autoTeamMap[key] = teamId;
      const stripped = key.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/,'').trim();
      if (stripped !== key) {
        if (autoIdMap[stripped] === undefined) autoIdMap[stripped] = id;
        if (teamId != null && autoTeamMap[stripped] === undefined) autoTeamMap[stripped] = teamId;
      }
      const last = stripped.split(' ').slice(-1)[0];
      (lastNameIndex[last] = lastNameIndex[last] || []).push({ id, teamId, full: stripped });
    });
    playerIndexReady = true;
  } catch(e) { console.error('Player index error:', e); }
}

// Resolve a roster name to a player ID: hand override → exact/stripped → unique last name.
function resolvePlayerId(name) {
  const u = normName(name);
  const stripped = u.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/,'').trim();
  if (PLAYER_IDS[u] !== undefined) return PLAYER_IDS[u];
  if (PLAYER_IDS[stripped] !== undefined) return PLAYER_IDS[stripped];
  if (autoIdMap[u] !== undefined) return autoIdMap[u];
  if (autoIdMap[stripped] !== undefined) return autoIdMap[stripped];
  const last = stripped.split(' ').slice(-1)[0];
  const cands = lastNameIndex[last] || [];
  if (cands.length === 1) return cands[0].id;
  if (cands.length > 1) {
    const firstInit = stripped.charAt(0);
    const byInit = cands.filter(c => c.full.charAt(0) === firstInit);
    if (byInit.length === 1) return byInit[0].id;
  }
  return null;
}

// Resolve a roster name to its current team ID (for live/upcoming game context).
function teamIdFor(name) {
  const u = normName(name);
  const stripped = u.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/,'').trim();
  if (PLAYER_TEAM_IDS[u] !== undefined) return PLAYER_TEAM_IDS[u];
  if (PLAYER_TEAM_IDS[stripped] !== undefined) return PLAYER_TEAM_IDS[stripped];
  if (autoTeamMap[u] !== undefined) return autoTeamMap[u];
  if (autoTeamMap[stripped] !== undefined) return autoTeamMap[stripped];
  const last = stripped.split(' ').slice(-1)[0];
  const cands = lastNameIndex[last] || [];
  if (cands.length === 1) return cands[0].teamId;
  if (cands.length > 1) {
    const firstInit = stripped.charAt(0);
    const byInit = cands.filter(c => c.full.charAt(0) === firstInit);
    if (byInit.length === 1) return byInit[0].teamId;
  }
  return null;
}

// Fetch HRs for every rostered player over a date window, keyed for lookupHR().
async function fetchHRLeaders(startDate, endDate) {
  const entries = Object.entries(ROSTER_IDS);
  const fetches = entries.map(async ([nkey, id]) => {
    try {
      const url = `https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=byDateRange&season=2026&startDate=${startDate}&endDate=${endDate}&group=hitting`;
      const r = await fetch(url);
      if (!r.ok) return { nkey, hrs: 0 };
      const d = await r.json();
      const splits = d?.stats?.[0]?.splits || [];
      // byDateRange returns the aggregate total as splits[0]; any further splits are
      // a monthly/per-stint breakdown of that same total, so summing them double-counts.
      const hrs = parseInt(splits[0]?.stat?.homeRuns) || 0;
      return { nkey, hrs };
    } catch(e) {
      return { nkey, hrs: 0 };
    }
  });
  const results = await Promise.all(fetches);
  const map = {};
  results.forEach(({ nkey, hrs }) => {
    map[nkey] = hrs;
    const stripped = nkey.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/,'').trim();
    if (stripped !== nkey) map[stripped] = hrs;
    const parts = nkey.split(' ');
    const last = parts[parts.length - 1];
    if (!['JR.','JR','SR.','SR','II','III','IV'].includes(last)) {
      if (!map[last]) map[last] = hrs;
    }
  });
  return map;
}

// Season total = first half + second half, merged per player key.
function deriveSeason(h1, h2) {
  const out = {};
  const keys = new Set([...Object.keys(h1), ...Object.keys(h2)]);
  keys.forEach(k => { out[k] = (h1[k] || 0) + (h2[k] || 0); });
  return out;
}

// ── SLOT-WINDOW HR DATA (IR slots only) ───────────────────
// For a slot that changed hands mid-half, the whole-half totals in h2HR are the
// wrong number for BOTH occupants: the outgoing guy's include HRs after he left
// and the incoming guy's include HRs before he arrived. So each stint gets its
// own date-bounded query and the slot is the sum. Slots that never changed hands
// are untouched and keep using h2HR.
let stintHR = {};   // `${mgr}|${pos}|${i}` -> HRs during stint i's own window
let slotWin = {};   // `${mgr}|${pos}|${tag}` -> HRs for that slot over a split window

async function windowHR(playerName, start, end) {
  const id = resolvePlayerId(playerName);
  if (id == null) return 0;
  try {
    const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=byDateRange&season=2026&startDate=${start}&endDate=${end}&group=hitting`);
    if (!r.ok) return 0;
    const d = await r.json();
    // byDateRange returns the aggregate as splits[0]; later splits re-break it out.
    return parseInt(d?.stats?.[0]?.splits?.[0]?.stat?.homeRuns) || 0;
  } catch(e) { return 0; }
}

// Fingerprint of every slot's occupant chain. If this changes — you pushed a new
// SEED_IR, or a manager made a local swap — any cached HR payload is stale and
// must be thrown out, even if it's only seconds old.
function slotSignature() {
  const parts = [];
  MANAGERS.forEach(m => POSITIONS.forEach(pos => {
    const st = slotStints(m, pos);
    if (st.length > 1) parts.push(`${m}|${pos}|` + st.map(x => `${x.player}@${x.from}-${x.to||''}`).join(','));
  }));
  return parts.join(';');
}

async function fetchSlotWindows() {
  const today = todayStr();
  const splitWindows = [
    { tag:'d7',  start: dateStr(7)  },
    { tag:'d14', start: dateStr(14) },
    { tag:'d30', start: dateStr(30) },
  ];
  const nextStint = {}, nextWin = {};
  const jobs = [];

  MANAGERS.forEach(m => POSITIONS.forEach(pos => {
    if (!slotHasStints(m, pos)) return;
    // Per-stint totals over each stint's own window (drives the 2H slot total).
    slotStints(m, pos).forEach((s, i) => {
      jobs.push(windowHR(s.player, s.from, s.to || today)
        .then(hr => { nextStint[`${m}|${pos}|${i}`] = hr; }));
    });
    // Rolling splits, clipped so no occupant is credited outside his own stint.
    splitWindows.forEach(w => {
      const key = `${m}|${pos}|${w.tag}`;
      nextWin[key] = 0;
      clampStints(m, pos, w.start, today).forEach(p => {
        jobs.push(windowHR(p.player, p.from, p.to)
          .then(hr => { nextWin[key] = (nextWin[key] || 0) + hr; }));
      });
    });
  }));

  await Promise.all(jobs);
  stintHR = nextStint;
  slotWin = nextWin;
}

async function loadLive(force = false) {
  const now = Date.now();
  const TEN_MIN = 5 * 60 * 1000; // 5 min cache

  // Use in-memory cache if recent enough and not forced
  if (!force && (now - lastHRFetch) < TEN_MIN && Object.keys(liveHR).length) {
    renderStandings(); renderActivity().catch(console.error); renderSplits();
    return;
  }

  // Try localStorage cache first for instant render
  try {
    const cached = JSON.parse(localStorage.getItem(HR_CACHE_KEY) || 'null');
    if (!force && cached && cached.date === todayStr() && (now - cached.ts) < TEN_MIN && cached.h1 && cached.v === 2 && cached.sig === slotSignature()) {
      h1HR = cached.h1; h2HR = cached.h2;
      liveHR = deriveSeason(h1HR, h2HR);
      splitHR = { d7: cached.d7, d14: cached.d14, d30: cached.d30 };
      stintHR = cached.stint || {}; slotWin = cached.slotwin || {};
      lastHRFetch = cached.ts;
      document.getElementById('upd-txt').textContent = `Updated ${new Date(cached.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · cached`;
      renderStandings(); renderActivity().catch(console.error); renderSplits();
      return;
    }
  } catch(e) {}

  document.getElementById('upd-txt').textContent = 'Fetching...';
  // Make sure names are resolved to IDs before fetching stats.
  if (!playerIndexReady) { await buildPlayerIndex(); resolveRosterIds(); }
  else if (!Object.keys(ROSTER_IDS).length) { resolveRosterIds(); }

  try {
    const today = todayStr();
    // First half is a frozen window; second half + splits run to today.
    const [h1, h2, d7, d14, d30] = await Promise.all([
      fetchHRLeaders(FIRST_HALF_START, FIRST_HALF_END),
      fetchHRLeaders(SECOND_HALF_START, today),
      fetchHRLeaders(dateStr(7),  today),
      fetchHRLeaders(dateStr(14), today),
      fetchHRLeaders(dateStr(30), today),
    ]);
    h1HR = h1; h2HR = h2;
    liveHR = deriveSeason(h1, h2);
    splitHR = { d7, d14, d30 };
    // Date-bounded totals for any slot that changed hands mid-half.
    await fetchSlotWindows();
    lastHRFetch = Date.now();
    // Cache to localStorage
    try {
      localStorage.setItem(HR_CACHE_KEY, JSON.stringify({
        v: 2, sig: slotSignature(), date: today, ts: lastHRFetch,
        h1, h2, d7, d14, d30, stint: stintHR, slotwin: slotWin
      }));
    } catch(e) {}
    const ct = Object.values(liveHR).filter(v=>v>0).length;
    document.getElementById('upd-txt').textContent = `Updated ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${ct} players with HRs`;
  } catch(e) {
    document.getElementById('upd-txt').textContent = 'Could not load HR data';
    console.error(e);
  }
  renderStandings(); renderActivity().catch(console.error); renderSplits();
}

let lastGamesFetch = 0;
const GAMES_CACHE_MS = 2 * 60 * 1000; // 2 minutes

async function loadTodayGames(force = false) {
  const now = Date.now();
  // Skip if recently fetched and not forced and no live games running
  if (!force && (now - lastGamesFetch) < GAMES_CACHE_MS && !rosterAutoRefresh) {
    return;
  }
  try {
    const today = todayStr();
    const schedRes = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today}&gameType=R&hydrate=linescore,teams`);
    if (!schedRes.ok) { console.error('Schedule failed:', schedRes.status); return; }
    lastGamesFetch = Date.now();
    const j = await schedRes.json();
    const games = j?.dates?.[0]?.games || [];


    // Preserve entries with HRs from previous fetches so Final game stats aren't lost
    const preserved = {};
    Object.entries(todayGames).forEach(([k,v]) => {
      if (v && v.hr > 0) preserved[k] = v;
    });
    todayGames = { ...preserved };
    let hasLive = false;

    // Only fetch boxscores for games involving our league's teams (saves ~13 API calls)
    const leagueTeamIds = leagueTeamIdSet();
    const relevantGames = games.filter(g => {
      const awayId = g.teams?.away?.team?.id;
      const homeId = g.teams?.home?.team?.id;
      return leagueTeamIds.has(awayId) || leagueTeamIds.has(homeId);
    });
    const activeRelevant = relevantGames.filter(g => ['Live','Final'].includes(g.status?.abstractGameState));
    const boxFetches = activeRelevant
      .map(g => fetch(`https://statsapi.mlb.com/api/v1/game/${g.gamePk}/boxscore`)
        .then(r => r.ok ? r.json() : null)
        .then(bs => ({ gamePk: g.gamePk, bs }))
        .catch(() => ({ gamePk: g.gamePk, bs: null }))
      );
    const boxes = await Promise.all(boxFetches);
    const boxMap = Object.fromEntries(boxes.map(b => [b.gamePk, b.bs]));

    games.forEach(g => {
      const state = g.status?.abstractGameState || 'Preview';
      const detailedState = g.status?.detailedState || '';
      const isLive = detailedState === 'In Progress';
      const isFinal = state === 'Final';
      const isUpcoming = !isLive && !isFinal; // Preview, Pre-Game, Warmup all treated as upcoming
      if (isLive) hasLive = true;

      const away = g.teams?.away?.team?.name || '';
      const home = g.teams?.home?.team?.name || '';
      const awayId = g.teams?.away?.team?.id;
      const homeId = g.teams?.home?.team?.id;
      const awayScore = g.teams?.away?.score ?? null;
      const homeScore = g.teams?.home?.score ?? null;
      const inning = g.linescore?.currentInning || '';
      const inningHalf = g.linescore?.inningHalf || '';
      const gameDate = g.gameDate || '';
      const gameTime = gameDate ? new Date(gameDate).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',timeZoneName:'short'}) : '';

      const gameInfo = { state, isLive, isFinal, isUpcoming, away, home, awayId, homeId, awayScore, homeScore, inning, inningHalf, gameTime };

      // Always store team entries so players not in batting order still get game context
      // isUpcoming only true for preview/scheduled/warmup - live and final show score
      if (awayId) todayGames['__team__'+awayId] = { ...gameInfo, isUpcoming, hr: null, ab: null, h: null };
      if (homeId) todayGames['__team__'+homeId] = { ...gameInfo, isUpcoming, hr: null, ab: null, h: null };

      const bs = boxMap[g.gamePk];
      if (bs && (isLive || isFinal)) {
        ['away','home'].forEach(side => {
          const batters = bs?.teams?.[side]?.batters || [];
          const playerMap = bs?.teams?.[side]?.players || {};
          batters.forEach(pid => {
            const p = playerMap['ID'+pid];
            if (!p) return;
            const name = normName(p.person?.fullName || '');
            const st = p.stats?.batting || {};
            const entry = {
              ...gameInfo,
              ab: st.atBats ?? null,
              h:  st.hits ?? null,
              hr: st.homeRuns ?? 0,
              rbi: st.rbi ?? null,
            };
            todayGames[name] = entry;
            // Also index without suffix for matching
            const stripped = name.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/,'').trim();
            if (stripped !== name) todayGames[stripped] = entry;

          });
        });
      }
    });

    // Store upcoming game time by team abbrev for players not in boxscore
    // We'll look up by scanning TEAM_ABBREVS

    // Save today's game stats to localStorage for persistence
    saveTodayStats();
    // Refresh standings dingers section whenever game data updates
    renderTodaysDingers();
    renderYesterdaysDingers();
    document.getElementById('live-indicator').style.display = hasLive ? 'inline' : 'none';
    document.getElementById('roster-upd-txt').textContent = `Games updated ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;

    if (rosterAutoRefresh) clearInterval(rosterAutoRefresh);
    if (hasLive) rosterAutoRefresh = setInterval(refreshRoster, 60000);

  } catch(e) { console.error('Today games error:', e); }
}

function getPlayerGameInfo(playerName) {
  const u = normName(playerName);
  // 1. Exact full name match
  if (todayGames[u]) return todayGames[u];
  // 2. Match without suffix (Jr., Sr., II etc)
  const stripped = u.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/, '').trim();
  if (stripped !== u && todayGames[stripped]) return todayGames[stripped];
  // 3. Team ID lookup
  // Check both the roster name AND common API variants (Nick/Nicholas etc)
  const teamId = teamIdFor(u) || teamIdFor(stripped);
  if (teamId) {
    // For active games: find any boxscore entry on the correct team
    // whose last name matches ours
    const ourLastName = stripped.split(' ').slice(-1)[0];
    for (const [key, val] of Object.entries(todayGames)) {
      if (key.startsWith('__team__')) continue;
      if ((val.awayId === teamId || val.homeId === teamId)) {
        // Check if last name matches
        const keyLast = key.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/,'').split(' ').slice(-1)[0];
        if (keyLast === ourLastName) return val;
      }
    }
    // For upcoming games
    if (todayGames['__team__'+teamId]) return todayGames['__team__'+teamId];
  }
  return null;
}

  if (gi.isUpcoming) {

    return `<span class="today-time">🕐 ${gi.gameTime} &nbsp;${awayShort} @ ${homeShort}</span>`;
  }

  const inningStr = gi.isLive ? `<span class="today-inning">${inningArrow}${gi.inning}</span>` : '';
  // Shorten team names for display
  const awayShort = gi.away.split(' ').slice(-1)[0];
  const homeShort = gi.home.split(' ').slice(-1)[0];
  const scoreStr = (gi.awayScore !== null)
    ? `<span class="today-score">${awayShort} ${gi.awayScore} · ${homeShort} ${gi.homeScore}${gi.isFinal ? ' F' : ''}</span>`
    : '';

// ── TEAM DATA ─────────────────────────────────────────────
// FIRST HALF: frozen. First-half roster, first-half HRs, no IR (the half is closed).
function getFirstHalfTeam(mgr) {
  const positions = [];
  let totalHR = 0;
  POSITIONS.forEach(pos => {
    const player = ROSTERS[mgr][pos];
    const hr = getH1(player) ?? 0;
    positions.push({ pos, player, hr, onIR:false, replacement:null });
    totalHR += hr;
  });
  positions.sort((a,b) => b.hr - a.hr);
  return { positions, totalHR };
}

// SECOND HALF: live. Second-half roster, second-half HRs. IR applies here only,
// since the first half is locked — locked/replacement HRs are second-half values.
function getSecondHalfTeam(mgr) {
  const positions = [];
  let totalHR = 0;
  POSITIONS.forEach(pos => {
    const changed = slotChanged(mgr, pos);
    const stints = slotStints(mgr, pos);
    if (stints.length === 1) {
      // Slot never changed hands: whole-half total is correct as-is.
      const player = stints[0].player;
      const hr = getH2(player) ?? 0;
      positions.push({ pos, player, hr, onIR:false, replacement:null, changed, stints, parts:null, slotHR:hr, seeded: slotIsSeeded(mgr, pos) });
      totalHR += hr;
    } else {
      // Slot changed hands: sum each occupant's HRs over his own window only.
      const parts = stints.map((s, i) => ({ ...s, hr: stintHR[`${mgr}|${pos}|${i}`] ?? 0 }));
      const slotHR   = parts.reduce((a, b) => a + b.hr, 0);
      const current  = parts[parts.length - 1];
      const lockedHR = parts.slice(0, -1).reduce((a, b) => a + b.hr, 0);
      positions.push({
        pos,
        player: parts[0].player,        // the original second-half occupant
        hr: parts[0].hr,
        onIR: true,
        replacement: current.player,    // who's in the slot right now
        repAdded: current.hr,           // what he's added since taking it over
        lockedHR,                       // everything banked by prior occupants
        slotHR,
        parts,
        stints,
        seeded: slotIsSeeded(mgr, pos),
        changed,
      });
      totalHR += slotHR;
    }
  });
  positions.sort((a,b) => (b.slotHR ?? b.hr) - (a.slotHR ?? a.hr));
  return { positions, totalHR };
}

// TOTAL: first-half locked total + second-half live total.
function getTotalHR(mgr) {
  return getFirstHalfTeam(mgr).totalHR + getSecondHalfTeam(mgr).totalHR;
}

// Convenience: pick the team object for a race ('h1' | 'h2').
function getRaceTeam(mgr, race) {
  return race === 'h1' ? getFirstHalfTeam(mgr) : getSecondHalfTeam(mgr);
}

function getTodayHRsForManager(mgr) {
  let total = 0;
  POSITIONS.forEach(pos => {
    const player = activePlayer(mgr, pos);
    const gi = getPlayerGameInfo(player);
    if (gi && !gi.isUpcoming && gi.hr > 0) total += gi.hr;
  });
  return total;
}

const RACE_LABEL = { h1:'First Half', h2:'Second Half', total:'Total' };
const RACE_SUB = {
  h1: 'Frozen at the All-Star break — first-half rosters, HRs through July 14. This race is final.',
  h2: 'Live — second-half rosters, HRs from July 15 onward. Second-half games resume mid-July.',
  total: 'First half (locked) + second half (live). Dropped players keep their first-half HRs; new additions count only from the break forward.',
};

function setRace(race, btn) {
  activeRace = race;
  document.querySelectorAll('#race-tabs .race-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderStandings();
}

function renderStandings() {
  const race = activeRace;
  document.getElementById('standings-hd').textContent = `${RACE_LABEL[race]} Standings`;
  const subEl = document.getElementById('race-sub');
  if (subEl) subEl.textContent = RACE_SUB[race];

  const data = MANAGERS.map(m => {
    if (race === 'total') {
      const h1 = getFirstHalfTeam(m).totalHR;
      const h2 = getSecondHalfTeam(m).totalHR;
      return { mgr:m, value:h1+h2, h1, h2 };
    }
    return { mgr:m, value:getRaceTeam(m, race).totalHR };
  }).sort((a,b) => b.value - a.value);

  const mx = Math.max(...data.map(d=>d.value), 1);
  // "Today" flash only applies to live races (second half / total).
  const showToday = race !== 'h1';

  document.getElementById('standings-wrap').innerHTML = data.map((d,i) => {
    const todayHRs = showToday ? getTodayHRsForManager(d.mgr) : 0;
    const flashBadge = todayHRs > 0
      ? `<span style="font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:var(--red);margin-left:8px;letter-spacing:0.5px">💥 x${todayHRs}</span>`
      : '';
    const breakdown = race === 'total'
      ? `<div class="split-hr"><span class="split-num">${d.h1} <span style="font-size:11px">1H</span> + <b>${d.h2}</b> <span style="font-size:11px">2H</span></span></div>`
      : '';
    return `<div class="stand-card ${i===0?'first':''}" onclick="goToRoster('${d.mgr}')" style="cursor:pointer">
      <div class="stand-top">
        <div class="rank-n">${i+1}</div>
        <div>
          <div class="mgr-name">${d.mgr}</div>
          <div class="mgr-sub">Click to view roster →</div>
        </div>
        <div style="text-align:right">
          <div style="display:flex;align-items:baseline;justify-content:flex-end;gap:0">
            <div class="hr-big">${d.value}</div>${flashBadge}
          </div>
          <div class="hr-lbl">HOME RUNS</div>
          ${breakdown}
        </div>
      </div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(d.value/mx*100).toFixed(1)}%"></div></div>
    </div>`;
  }).join('');
  renderTodaysDingers();
}

// ── SPLITS ────────────────────────────────────────────────
// For a slot that changed hands, the rolling window is clipped per occupant
// (precomputed into slotWin) so nobody is credited for HRs hit outside his stint.
function getTeamSplit(mgr, hrMap, tag) {
  let total = 0;
  POSITIONS.forEach(pos => {
    if (slotHasStints(mgr, pos)) {
      total += slotWin[`${mgr}|${pos}|${tag}`] ?? 0;
    } else {
      total += lookupHR(hrMap, activePlayer(mgr, pos)) ?? 0;
    }
  });
  return total;
}
function computeSplits() {
  const result = {};
  MANAGERS.forEach(m => {
    result[m] = {
      d7:  getTeamSplit(m, splitHR.d7,  'd7'),
      d14: getTeamSplit(m, splitHR.d14, 'd14'),
      d30: getTeamSplit(m, splitHR.d30, 'd30'),
    };
  });
  return result;
}
function renderSplits() {
  const splits = computeSplits();
  const data = MANAGERS.map(m => ({ mgr:m, total:getTotalHR(m), ...splits[m] })).sort((a,b)=>b.total-a.total);
  document.getElementById('splits-body').innerHTML = `
    <p style="font-family:Barlow Condensed,sans-serif;font-size:12px;color:var(--cream-dim);margin-bottom:14px">HR totals for the last 7, 14, and 30 calendar days pulled directly from MLB Stats API.</p>
    <table class="splits-tbl">
      <thead><tr><th>MANAGER</th><th>TOTAL</th><th>LAST 7</th><th>LAST 14</th><th>LAST 30</th><th>PACE</th></tr></thead>
      <tbody>${data.map(d=>`<tr>
        <td><span class="split-mgr">${d.mgr}</span></td>
        <td><span class="split-val">${d.total}</span></td>
        <td><span class="split-val">${d.d7}</span></td>
        <td><span class="split-val">${d.d14}</span></td>
        <td><span class="split-val">${d.d30}</span></td>
        <td><span class="split-val ${projectedFinal(d.total)>=200?'pace-good':'pace-bad'}">${projectedFinal(d.total)}</span></td>
      </tr>`).join('')}</tbody>
    </table>`;
}

// ── ROSTER ────────────────────────────────────────────────
function renderRosterTabs() {
  document.getElementById('roster-tabs').innerHTML = MANAGERS.map(m =>
    `<button class="tab-btn ${m===rMgr?'active':''}" onclick="switchRMgr('${m}')">${m}</button>`).join('');
}
function switchRMgr(m) { rMgr=m; renderRoster(); }

function renderRoster() {
  renderRosterTabs();
  const { positions, totalHR: h2Total } = getSecondHalfTeam(rMgr);
  const h1Total = getFirstHalfTeam(rMgr).totalHR;
  const seasonTotal = h1Total + h2Total;
  const body = document.getElementById('roster-body');

  const rows = positions.map(p => {
    const h2hr = p.slotHR ?? p.hr;
    const displayPlayer = p.onIR && p.replacement ? p.replacement : p.player;
    // Both HR columns are SLOT totals, not player totals, so the row adds up to
    // the standings: whoever held the slot in the first half + the slot's
    // second-half chain. (The occupant's own career line is not the unit here.)
    const season = (getH1(ROSTERS[rMgr][p.pos]) ?? 0) + h2hr;
    const gi = getPlayerGameInfo(displayPlayer);
    const isLive = gi?.isLive || false;
    const firstHalfPlayer = ROSTERS[rMgr][p.pos];

    // Player name row — the SLOT is the unit, so show who's in it now and
    // spell out the chain of occupants underneath with each one's contribution.
    let nameHtml = `<span class="pos-pill">${p.pos}</span>`;
    nameHtml += `<span class="player-name">${p.onIR ? p.replacement : p.player}</span>`;
    if (p.changed) nameHtml += `<span class="rep-pill">NEW 2H</span>`;
    if (p.onIR) {
      nameHtml += `<span class="ir-pill">SLOT</span>`;
      nameHtml += `<span class="rep-pill">+${p.repAdded} SINCE ${fmtMD(p.parts[p.parts.length-1].from)}</span>`;
    }
    if (isLive) nameHtml += ` <span class="live-dot"></span>`;
    // Note who this slot replaced at the break
    let swapHtml = '';
    if (p.changed) swapHtml = `<span class="swap-note">replaced ${firstHalfPlayer} for 2nd half</span>`;
    // Full occupant chain for a slot that changed hands mid-half.
    let chainHtml = '';
    if (p.onIR) {
      chainHtml = `<div class="stint-chain">` + p.parts.map((s, i) =>
        `<span class="stint${i === p.parts.length-1 ? ' stint-active' : ''}">${s.player} <span class="stint-win">${fmtMD(s.from)}–${s.to ? fmtMD(s.to) : 'now'}</span> <b>${s.hr}</b></span>`
      ).join(`<span class="stint-arrow">→</span>`) +
      (p.seeded ? `<span class="stint-lock">locked in file</span>` : '') + `</div>`;
    }

    const gameInfoHtml = formatGameInfo(gi, displayPlayer);

    // Seeded slots are committed in the file and shared by the whole league —
    // don't let a local click diverge one manager's view from everyone else's.
    const cur = (p.onIR ? p.replacement : p.player).replace(/'/g, "\\'");
    const irBtn = p.seeded
      ? `<span class="btn-sm btn-locked" title="Set in the file — same for every manager">LOCKED</span>`
      : `<button class="btn-sm btn-ir" onclick="openIR('${rMgr}','${p.pos}')">Swap</button>` +
        (p.onIR ? `<button class="btn-sm btn-restore" onclick="undoSwap('${rMgr}','${p.pos}')">Undo</button>` : '');

    return `<tr>
      <td class="player-cell">
        <div class="player-name-row">${nameHtml}</div>
        ${swapHtml ? `<div style="margin:1px 0 2px">${swapHtml}</div>` : ''}
        ${chainHtml}
        <div class="today-game-info">${gameInfoHtml}</div>
      </td>
      <td class="hr-cell">${h2hr}</td>
      <td class="hr-cell" style="color:var(--cream-dim)">${season}</td>
      <td class="action-cell">${irBtn}</td>
    </tr>`;
  }).join('');

  body.innerHTML = `
    <div class="race-sub" style="margin-bottom:10px">Showing the <b style="color:var(--cream)">second-half roster</b> (active). Both columns are <b style="color:var(--cream)">slot</b> totals, not player totals — a slot keeps every HR hit by everyone who held it, and each occupant only counts inside his own window.</div>
    <table class="roster-tbl">
      <thead><tr>
        <th>PLAYER</th>
        <th class="center">2H HR</th>
        <th class="center">SEASON</th>
        <th class="center"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="roster-footer">
      1st Half (locked): <strong style="font-family:Bebas Neue,sans-serif;font-size:18px">${h1Total}</strong> &nbsp;·&nbsp;
      2nd Half: <strong style="font-family:Bebas Neue,sans-serif;font-size:18px">${h2Total}</strong> &nbsp;·&nbsp;
      Total: <strong style="color:var(--gold);font-family:Bebas Neue,sans-serif;font-size:18px">${seasonTotal} HR</strong>
    </div>`;
}

async function refreshRoster() {
  await loadTodayGames();
  renderRoster();
}

// ── ACTIVITY ──────────────────────────────────────────────
// Set of all league player names (normalized) for deduplication
function getLeaguePlayerNames() {
  const names = new Set();
  const add = (player) => {
    if (!player) return;
    const u = normName(player);
    names.add(u);
    const stripped = u.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/, '').trim();
    if (stripped !== u) names.add(stripped);
  };
  MANAGERS.forEach(m => {
    POSITIONS.forEach(pos => {
      slotStints(m, pos).forEach(st => add(st.player));
      add(ROSTERS[m][pos]);          // first-half players count as league too
    });
  });
  return names;
}

async function fetchMLBTop100() {
  try {
    // Use the MLB stats API season HR leaderboard
    const url = `https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=homeRuns&season=2026&sportId=1&limit=100&statGroup=hitting`;
    const r = await fetch(url);
    if (!r.ok) return [];
    const d = await r.json();
    const leaders = d?.leagueLeaders?.[0]?.leaders || [];
    return leaders.map(l => ({
      name: l.person?.fullName || '',
      hr: parseInt(l.value) || 0,
    })).filter(p => p.name && p.hr > 0);
  } catch(e) {
    console.error('MLB top 100 fetch error:', e);
    return [];
  }
}

async function renderActivity() {
  const body = document.getElementById('activity-body');
  body.innerHTML = '<div class="loading-pulse">LOADING...</div>';

  // League players (active second-half roster, ranked by full-season HRs)
  const all = [];
  MANAGERS.forEach(m => {
    getSecondHalfTeam(m).positions.forEach(p => {
      const displayPlayer = p.onIR && p.replacement ? p.replacement : p.player;
      const hr = getHR(displayPlayer) ?? 0;
      all.push({ mgr:m, pos:p.pos, player:p.player, hr, isLeague:true });
    });
  });

  // MLB top 100 — fetch and filter out league players
  const leagueNames = getLeaguePlayerNames();
  let mlbPlayers = [];
  try {
    const top100 = await fetchMLBTop100();
    mlbPlayers = top100
      .filter(p => {
        const u = normName(p.name);
        const stripped = u.replace(/\s+(JR\.?|SR\.?|II|III|IV)$/, '').trim();
        return !leagueNames.has(u) && !leagueNames.has(stripped);
      })
      .map(p => ({ player: p.name, hr: p.hr, isLeague: false, mgr: null, pos: null }));
  } catch(e) {}

  // Merge and sort
  const combined = [...all, ...mlbPlayers].sort((a,b) => b.hr - a.hr);

  if (!combined.length) {
    body.innerHTML = '<div class="empty-msg"><strong>NO DATA</strong><span>Refresh to load stats.</span></div>';
    return;
  }

  // Top cards — only league players
  const topLeague = all.filter(p=>p.hr>0).sort((a,b)=>b.hr-a.hr).slice(0,9);

  body.innerHTML = `
    <div class="act-grid">${topLeague.map(p=>`
      <div class="act-card">
        <div class="act-mgr">${p.mgr}</div>
        <div class="act-player">${p.player}</div>
        <div class="act-hr">${p.hr}</div>
        <div class="act-pos">${p.pos}</div>
      </div>`).join('')}
    </div>
    <div class="sec-hd" style="margin-bottom:10px">Full League Board</div>
    <p style="font-family:Barlow Condensed,sans-serif;font-size:11px;color:var(--cream-dim);margin-bottom:10px;letter-spacing:0.5px">
      <span style="color:#5dcc80">■</span> MLB players not in league &nbsp;·&nbsp; <span style="color:var(--brown-light)">■</span> League players
    </p>
    <table class="splits-tbl">
      <thead><tr><th>PLAYER</th><th>MGR</th><th>POS</th><th>HR</th><th>PACE</th></tr></thead>
      <tbody>${combined.map(p=>{
        const nameColor = p.isLeague ? '' : 'color:#5dcc80;';
        const hrColor = p.isLeague ? 'color:var(--brown-light)' : 'color:#5dcc80';
        const paceColor = projectedFinal(p.hr)>=20 ? 'pace-good' : 'pace-bad';
        return `<tr>
          <td><strong style="${nameColor}">${p.player}</strong></td>
          <td><span style="color:var(--gold);font-family:Bebas Neue,sans-serif">${p.mgr || '—'}</span></td>
          <td><span class="pos-pill">${p.pos || '—'}</span></td>
          <td class="hr-cell" style="padding:6px 10px;${hrColor}">${p.hr}</td>
          <td class="pace-cell ${paceColor}" style="padding:6px 10px">${projectedFinal(p.hr)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
}

// ── SLOT SWAPS (IR / in-season replacement) ───────────────
// Appends a stint. The outgoing occupant's window closes the day before the new
// guy's start date, so his banked HRs are frozen and he can never add to this
// slot again; the incoming guy is credited only from his start date forward.
function openIR(mgr, pos) {
  const stints = slotStints(mgr, pos);
  const cur = stints[stints.length - 1];
  irPending = { mgr, pos, outgoing: cur.player };
  document.getElementById('ir-modal-title').textContent = 'SWAP THIS SLOT';
  document.getElementById('ir-modal-sub').textContent =
    `${cur.player} comes out of ${mgr}'s ${pos}. Everything he hit while he held the slot stays on the board — he just stops adding to it. The incoming player counts from his start date forward, nothing before.`;
  document.getElementById('ir-rep-name').value = '';
  document.getElementById('ir-swap-date').value = todayStr();
  document.getElementById('ir-swap-date').min = cur.from;
  document.getElementById('ir-swap-date').max = todayStr();
  document.getElementById('ir-modal-err').textContent = '';
  document.getElementById('ir-modal').classList.add('open');
}

async function confirmIR() {
  if (!irPending) return;
  const { mgr, pos } = irPending;
  const err = document.getElementById('ir-modal-err');
  const btn = document.getElementById('ir-confirm-btn');
  const repName = document.getElementById('ir-rep-name').value.trim();
  const start   = document.getElementById('ir-swap-date').value;
  err.textContent = '';

  if (!repName) { err.textContent = 'Enter the incoming player\'s name.'; return; }
  if (!start)   { err.textContent = 'Pick a start date.'; return; }

  const stints = slotStints(mgr, pos);
  const cur = stints[stints.length - 1];
  if (start < cur.from) { err.textContent = `Start date can't be before ${fmtMD(cur.from)} — that's when the current occupant took the slot.`; return; }
  if (start > todayStr()) { err.textContent = 'Start date can\'t be in the future.'; return; }

  // Validate the name against MLB's roster BEFORE saving. An unresolvable name
  // is the failure mode that used to sit there silently reading zero.
  btn.disabled = true; btn.textContent = 'CHECKING...';
  try {
    if (!playerIndexReady) await buildPlayerIndex();
    const id = resolvePlayerId(repName);
    if (id == null) {
      err.innerHTML = `Couldn't match <b>${repName}</b> to an MLB player. Use the full name exactly as it reads on baseballsavant.mlb.com.`;
      return;
    }
    if (!S.ir[mgr]) S.ir[mgr] = {};
    const chain = stints.map(x => ({ player: x.player, from: x.from, to: x.to }));
    chain[chain.length - 1].to = shiftDay(start, -1);
    chain.push({ player: repName, from: start, to: null });
    S.ir[mgr][pos] = chain;
    save();
    closeModal();
    // The new occupant isn't in the fetch set yet — re-resolve and repull.
    resolveRosterIds();
    renderRoster(); renderStandings();
    await loadLive(true);
    await loadTodayGames(true);
    renderRoster(); renderStandings(); renderTodaysDingers(); renderSplits();
  } finally {
    btn.disabled = false; btn.textContent = 'CONFIRM';
  }
}

// Undo the most recent local swap on a slot (mis-click escape hatch).
async function undoSwap(mgr, pos) {
  const chain = S.ir[mgr] && S.ir[mgr][pos];
  if (!Array.isArray(chain) || chain.length < 2) return;
  const dropped = chain[chain.length - 1].player;
  if (!confirm(`Undo the swap to ${dropped}? The slot goes back to ${chain[chain.length-2].player} as if it never happened.`)) return;
  chain.pop();
  chain[chain.length - 1].to = null;
  if (chain.length < 2) delete S.ir[mgr][pos]; else S.ir[mgr][pos] = chain;
  save();
  resolveRosterIds();
  renderRoster(); renderStandings();
  await loadLive(true);
  renderRoster(); renderStandings(); renderSplits();
}

function closeModal() { document.getElementById('ir-modal').classList.remove('open'); irPending=null; }

// ── NAV ───────────────────────────────────────────────────
function goToRoster(mgr) {
  rMgr = mgr;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-roster').classList.add('active');
  document.querySelectorAll('.nav-btn')[1].classList.add('active');
  renderRoster();
}

function showPanel(name, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if (btn) btn.classList.add('active');
  if (name==='standings') { renderStandings(); renderYesterdaysDingers(); loadTodayGames().then(() => { renderTodaysDingers(); renderYesterdaysDingers(); }); }
  if (name==='roster') { loadTodayGames().then(renderRoster); }
  if (name==='activity') renderActivity().catch(console.error);
  if (name==='splits') renderSplits();
}

// ── INIT ──────────────────────────────────────────────────
// Clear stale caches if it's a new baseball day
(function clearStaleCaches() {
  const today = todayStr();
  try {
    const hrCache = JSON.parse(localStorage.getItem(HR_CACHE_KEY) || 'null');
    if (hrCache && hrCache.date !== today) {
      localStorage.removeItem(HR_CACHE_KEY);
    }
  } catch(e) {}
  try {
    const todayStats = JSON.parse(localStorage.getItem(TODAY_STATS_KEY) || 'null');
    if (todayStats && todayStats.date !== today) {
      localStorage.removeItem(TODAY_STATS_KEY);
    }
  } catch(e) {}
})();

// Immediate paint from whatever's cached (index-independent), then resolve IDs and fetch.
renderStandings();
loadTodayStats();
renderRoster();
renderTodaysDingers();

(async function init() {
  // Resolve every rostered name → MLB ID before pulling stats or game context.
  await buildPlayerIndex();
  resolveRosterIds();
  // HR data (first half, second half, splits) and live game context.
  await loadLive();
  renderRoster();
  await loadTodayGames();
  renderTodaysDingers();
  renderYesterdaysDingers();
  renderRoster();
})();
</script>
