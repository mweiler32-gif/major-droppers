                })}
              </div>
            </div>
            
            {/* Cut Line Alert */}
            {cutLine && tournamentRound === 2 && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center gap-2">
                <span className="text-amber-600">✂️</span>
                <span className="text-amber-800 font-medium">Projected Cut: {cutLine}</span>
              </div>
            )}
            
            {/* Leaderboard */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="bg-gradient-to-r from-emerald-600 to-emerald-700 px-4 py-3 flex items-center justify-between">
                <h2 className="text-white font-bold">Tournament Leaderboard</h2>
                <button
                  onClick={fetchLiveScores}
                  disabled={isFetching}
                  className="px-2 py-1 bg-white/20 text-white rounded text-xs font-medium hover:bg-white/30 disabled:opacity-50"
                >
                  {isFetching ? '...' : '🔄'}
                </button>
              </div>
              
              {/* Column Headers */}
              <div className="grid grid-cols-12 gap-1 px-3 py-2 bg-gray-50 text-xs font-medium text-gray-500 border-b border-gray-100 sticky top-0">
                <div className="col-span-1 text-center">Pos</div>
                <div className="col-span-4">Player</div>
                <div className="col-span-1 text-center">Score</div>
                <div className="col-span-2 text-center">Thru</div>
                <div className="col-span-1 text-center">R1</div>
                <div className="col-span-1 text-center">R2</div>
                <div className="col-span-1 text-center">R3</div>
                <div className="col-span-1 text-center">R4</div>
              </div>
              
              <div className="max-h-[60vh] overflow-y-auto">
                {sortedGolfers.map((golfer, idx) => {
                  // Find owner by matching names (handles diacritics)
                  const ownerKey = Object.keys(golferOwners).find(key => namesMatch(golfer.name, key));
                  const owner = ownerKey ? golferOwners[ownerKey] : null;
                  const colors = owner ? TEAM_COLORS[owner] : null;
                  const isDrafted = !!owner;
                  const isCut = golfer.cut;
                  
                  return (
                    <div 
                      key={`${golfer.name}-${idx}`}
                      className={`grid grid-cols-12 gap-1 px-3 py-2 items-center border-b border-gray-50 last:border-0 ${
                        isCut ? 'bg-red-50 opacity-50' :
                        isDrafted ? `${colors.bg} border-l-4 ${colors.border}` : 
                        'hover:bg-gray-50'
                      }`}
                    >
                      <div className="col-span-1 text-center">
                        <span className={`text-xs font-medium ${golfer.position ? 'text-gray-700' : 'text-gray-400'}`}>
                          {golfer.position ? `${golfer.position}` : '—'}
                        </span>
                      </div>
                      <div className="col-span-4 flex items-center gap-2">
                        {isDrafted && (
                          <div className={`w-2.5 h-2.5 rounded-full ${colors.dot} flex-shrink-0`}></div>
                        )}
                        <span className={`text-sm truncate ${
                          isCut ? 'line-through text-gray-400' :
                          isDrafted ? `font-semibold ${colors.text}` : 
                          'text-gray-600'
                        }`}>
                          {golfer.name}
                        </span>
                        {isCut && <span className="text-xs text-red-500 font-medium">CUT</span>}
                      </div>
                      <div className="col-span-1 text-center">
                        <span className={`text-sm font-medium ${
                          golfer.score?.startsWith('-') ? 'text-red-600' :
                          golfer.score?.startsWith('+') ? 'text-blue-600' :
                          golfer.score === 'E' ? 'text-gray-700' :
                          'text-gray-400'

                          {golfer.score || '—'}
                        </span>
                      </div>
                      <div className="col-span-2 text-center">
                        <span className="text-xs text-gray-500">

                        </span>
                      </div>
                      {[0, 1, 2, 3].map(i => (
                        <div key={i} className="col-span-1 text-center">
                          <span className="text-xs font-mono text-gray-500">
                            {golfer.rounds?.[i] || '—'}
                          </span>
                        </div>

              </div>
            </div>
            
            {/* Last updated */}
            {lastFetch && (
              <div className="text-center text-xs text-gray-400">
                Last updated: {lastFetch.toLocaleTimeString()}
              </div>
            )}
          </div>
        );
      };

      // Settings View
      const SettingsView = () => {
        const saveTournamentToHistory = async () => {
          if (!tournamentName) {
            alert('Please set a tournament name first.');
            return;
          }

          // Helper to strip Infinity/NaN/undefined from any object for Firebase
          // Also sanitizes keys — Firebase forbids . # $ / [ ] in key names
          const sanitizeKey = (k) => k.replace(/[.#$\/\[\]]/g, '_');
          const sanitize = (obj) => {
            if (obj === null || obj === undefined) return null;
            if (typeof obj === 'number') {
              return isFinite(obj) ? obj : null;
            }
            if (Array.isArray(obj)) return obj.map(sanitize);
            if (typeof obj === 'object') {
              const out = {};
              for (const [k, v] of Object.entries(obj)) {
                const sanitized = sanitize(v);
                if (sanitized !== undefined) out[sanitizeKey(k)] = sanitized;
              }
              return out;
            }
            return obj;
          };

          // Compute standings and payouts fresh at save time
          const finalStandings = getFinalStandings();
          const completedRounds = ROUNDS.map((_, i) => {
            if (liveScores.length === 0) return false;
            const relevantGolfers = i >= 2 ? liveScores.filter(g => !g.cut) : liveScores;
            if (relevantGolfers.length === 0) return false;
            const withScores = relevantGolfers.filter(g => {
              const s = g.rounds?.[i];
              return s !== null && s !== undefined;
            }).length;
            return withScores / relevantGolfers.length >= 0.95;
          });
          const finalPayouts = calculatePayouts(completedRounds);

          // Build daily winners
          let dailyWinners = [];
          try {
            dailyWinners = ROUNDS.map((round, i) => {
              let lowGolfer = null, lowTeam = null;
              try { lowGolfer = getDailyLowGolfer(i); } catch(e) {}
              try { lowTeam = getDailyLowTeam(i); } catch(e) {}
              return {
                round,
                lowGolfer: lowGolfer ? { golfer: lowGolfer.golfer, score: lowGolfer.score, owner: lowGolfer.owner } : null,
                lowTeam: lowTeam ? { player: lowTeam.player, total: lowTeam.total } : null
              };
            }).filter(d => d.lowGolfer || d.lowTeam);
          } catch(e) { dailyWinners = []; }

          const historyEntry = sanitize({
            name: tournamentName,
            date: new Date().toISOString(),
            teams: teams,
            scores: scores || {},
            champion: champion || null,
            standings: finalStandings,
            payouts: finalPayouts,
            dailyWinners: dailyWinners
          });

          try {
            await database.ref('history').push(historyEntry);
            alert(`✅ "${tournamentName}" saved to history!`);
          } catch (err) {
            console.error('Error saving to history:', err);
            alert(`Error saving tournament: ${err.message || err}`);
          }
        };
        
        return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <h3 className="font-bold text-gray-800 mb-3">Tournament</h3>
            <select
              value={tournamentName}
              onChange={(e) => {
                const val = e.target.value;
                if (!val) return;
                setTournamentName(val);
                saveToFirebase({ tournamentName: val });
              }}
              className="w-full border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500"
            >
              {[
                'THE PLAYERS Championship 2026',
                'Masters 2026',
                'PGA Championship 2026',
                'US Open 2026',
                'The Open Championship 2026'
              ].map(name => (
                <option key={name} value={name}>{name}</option>
              ))}
            </select>
            <p className="text-xs text-gray-400 mt-2">Changing this updates the active tournament name</p>
          </div>
          
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <h3 className="font-bold text-gray-800 mb-3">Champion</h3>
            {champion ? (
              <div>
                <div className="flex items-center justify-between bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">
                  <span className="text-emerald-800 font-semibold">🏆 {champion}</span>
                  <span className="text-sm text-emerald-600">
                    Owner: {players.find(p => (teams[p] || []).some(g => namesMatch(g, champion))) || '—'}
                  </span>
                </div>
                <p className="text-xs text-gray-400 mt-1">Auto-detected from leaderboard position 1</p>
                <button
                  onClick={() => { setChampion(null); saveToFirebase({ champion: null }); }}
                  className="mt-2 text-xs text-red-400 hover:text-red-600 underline"
                >
                  Clear (manual override)
                </button>
              </div>
            ) : (
              <div>
                <p className="text-sm text-gray-400 mb-2">Auto-detects from leaderboard when scores are fetched.</p>
                <select
                  value=""
                  onChange={(e) => {
                    const val = e.target.value || null;
                    if (val) { setChampion(val); saveToFirebase({ champion: val }); }
                  }}
                  className="w-full border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 text-sm"
                >
                  <option value="">Manual override...</option>
                  {Object.values(teams).flat().sort().map(golfer => (
                    <option key={golfer} value={golfer}>{golfer}</option>
                  ))}
                </select>
              </div>
            )}
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <h3 className="font-bold text-gray-800 mb-3">Prize Pool Breakdown</h3>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between"><span>Entry Fee:</span><span className="font-mono">$70</span></div>
              <div className="flex justify-between"><span>Total Pool:</span><span className="font-mono">${ENTRY_FEE * players.length}</span></div>
              <div className="border-t border-gray-100 pt-2 mt-2">
                <div className="flex justify-between"><span>Solo Low (×4 rounds):</span><span className="font-mono">$120</span></div>
                <div className="flex justify-between"><span>Team Low (×4 rounds):</span><span className="font-mono">$120</span></div>
                <div className="flex justify-between"><span>Champion Bonus:</span><span className="font-mono">$30</span></div>
                <div className="flex justify-between"><span>Overall Winner:</span><span className="font-mono">$150</span></div>
              </div>
            </div>
          </div>
          
          {/* Save Tournament to History */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
            <h3 className="font-bold text-gray-800 mb-3">Tournament History</h3>
            <button
              onClick={saveTournamentToHistory}
              className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-blue-700 transition-colors mb-3"
            >
              💾 Save Tournament Results
            </button>
            <button
              onClick={() => setView('history')}
              className="w-full bg-gray-100 text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-200 transition-colors"
            >
              📜 View Past Tournaments ({tournamentHistory.length})
            </button>
          </div>

          <button
            onClick={() => setView('draft-setup')}
            className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-emerald-700 transition-colors"
          >
            🏌️ Start New Draft
          </button>

          <button
            onClick={async () => {
              if (confirm('Push all current teams, scores, and draft state from this device to Firebase? This will overwrite what is in the database.')) {
                await saveToFirebase({
                  teams,
                  scores,
                  champion: champion || null,
                  tournamentName,
                  draftState: {
                    draftMode: false,
                    availableGolfers: availableGolfers,
                    draftOrder: draftOrder,
                    currentPick: draftOrder.length
                  }
                });
                alert('✅ All data synced to Firebase!');
              }
            }}
            className="w-full bg-blue-50 text-blue-600 font-medium py-2 rounded-lg hover:bg-blue-100 transition-colors"
          >
            🔄 Force Sync to Firebase
          </button>

          <button 
            onClick={() => {
              if (confirm('Clear all data? This cannot be undone.')) {
                const newTeams = {};
                players.forEach(p => newTeams[p] = []);
                setTeams(newTeams);
                setScores({});
                setChampion(null);
                setDraftMode(false);
                database.ref('game').remove();
              }
            }}
            className="w-full bg-red-50 text-red-600 font-medium py-2 rounded-lg hover:bg-red-100 transition-colors"
          >
            Reset Everything
          </button>
        </div>
      );
      };
      
      // History View - Past Tournaments
      const HistoryView = () => {
        const [selectedTournament, setSelectedTournament] = useState(null);
        const [editingPayouts, setEditingPayouts] = useState(false);
        const [payoutDraft, setPayoutDraft] = useState({});
        const [savingPayouts, setSavingPayouts] = useState(false);

        const startEditPayouts = (t) => {
          // Pre-populate with existing payouts, or $0 for all players if missing
          const existing = t.payouts || {};
          const draft = {};
          DEFAULT_PLAYERS.forEach(p => {
            draft[p] = existing[p] !== undefined ? existing[p] : 0;
          });
          setPayoutDraft(draft);
          setEditingPayouts(true);
        };

        const savePayouts = async (t) => {
          setSavingPayouts(true);
          try {
            await database.ref(`history/${t.id}/payouts`).set(payoutDraft);
            // Update local state so UI reflects change immediately
            setSelectedTournament({ ...t, payouts: payoutDraft });
            setEditingPayouts(false);
            alert('✅ Payouts updated!');
          } catch (err) {
            alert(`Error saving payouts: ${err.message || err}`);
          }
          setSavingPayouts(false);
        };

        if (selectedTournament) {
          const t = selectedTournament;
          return (
            <div className="space-y-4">
              <button
                onClick={() => { setSelectedTournament(null); setEditingPayouts(false); }}
                className="text-blue-600 font-medium flex items-center gap-1"
              >
                ← Back to History
              </button>
              
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <h2 className="text-xl font-bold text-gray-800">{t.name}</h2>
                <p className="text-sm text-gray-500">{new Date(t.date).toLocaleDateString()}</p>
                {t.champion && (
                  <p className="text-emerald-600 font-medium mt-2">🏆 Champion: {t.champion}</p>
                )}
              </div>
              
              {/* Final Standings */}
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="bg-gradient-to-r from-emerald-600 to-emerald-700 px-4 py-3">
                  <h3 className="text-white font-bold">Final Standings</h3>
                </div>
                <div className="divide-y divide-gray-100">
                  {(t.standings || []).map((s, i) => (
                    <div key={s.player} className={`flex items-center justify-between px-4 py-3 ${i === 0 ? 'bg-amber-50' : ''}`}>
                      <div className="flex items-center gap-3">
                        <span className="text-sm text-gray-500 w-4">{i + 1}.</span>
                        <span className="font-semibold text-gray-800">{s.player}</span>
                      </div>
                      <span className="font-bold text-gray-800">{s.total}</span>
                    </div>
                  ))}
                </div>
              </div>
              
              {/* Payouts */}
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="bg-gradient-to-r from-green-600 to-green-700 px-4 py-3 flex items-center justify-between">
                  <h3 className="text-white font-bold">💰 Final Payouts</h3>
                  {!editingPayouts && (
                    <button
                      onClick={() => startEditPayouts(t)}
                      className="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-lg transition-colors"
                    >
                      ✏️ Edit
                    </button>
                  )}
                </div>

                {editingPayouts ? (
                  <div className="p-4 space-y-3">
                    <p className="text-xs text-gray-500">Enter gross payout per player (before subtracting $70 buy-in)</p>
                    {DEFAULT_PLAYERS.map(player => (
                      <div key={player} className="flex items-center gap-3">
                        <span className="font-medium text-gray-700 w-20">{player}</span>
                        <div className="flex items-center gap-1 flex-1">
                          <span className="text-gray-500">$</span>
                          <input
                            type="number"
                            min="0"
                            value={payoutDraft[player] || 0}
                            onChange={(e) => setPayoutDraft({ ...payoutDraft, [player]: parseInt(e.target.value) || 0 })}
                            className="flex-1 border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 text-right font-mono"
                          />
                        </div>
                      </div>
                    ))}
                    <div className="flex gap-2 pt-2">
                      <button
                        onClick={() => savePayouts(t)}
                        disabled={savingPayouts}
                        className="flex-1 bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 disabled:opacity-50"
                      >
                        {savingPayouts ? 'Saving...' : '💾 Save Payouts'}
                      </button>
                      <button
                        onClick={() => setEditingPayouts(false)}
                        className="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200"
                      >
                        Cancel
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="divide-y divide-gray-100">
                    {Object.entries(t.payouts || {})
                      .sort((a, b) => b[1] - a[1])
                      .map(([player, amount]) => (
                        <div key={player} className="flex items-center justify-between px-4 py-2">
                          <span className="font-medium text-gray-700">{player}</span>
                          <div className="text-right">
                            <span className={`font-bold ${amount > 0 ? 'text-green-600' : 'text-gray-400'}`}>
                              ${amount}
                            </span>
                            <span className={`ml-2 text-sm ${(amount - ENTRY_FEE) >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                              ({(amount - ENTRY_FEE) >= 0 ? '+' : ''}${amount - ENTRY_FEE})
                            </span>
                          </div>
                        </div>
                      ))}
                    {Object.keys(t.payouts || {}).length === 0 && (
                      <p className="text-gray-400 text-center py-4 text-sm">No payout data — tap Edit to add</p>
                    )}
                  </div>
                )}
              </div>
              
              {/* Daily Winners */}
              {t.dailyWinners && t.dailyWinners.length > 0 && (
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className="bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-3">
                    <h3 className="text-white font-bold">Daily Winners</h3>
                  </div>
                  <div className="divide-y divide-gray-100 p-4">
                    {t.dailyWinners.map((d, i) => (
                      <div key={i} className="py-2">
                        <div className="font-medium text-gray-700">{d.round}</div>
                        {d.lowGolfer && (
                          <div className="text-sm text-gray-600 ml-3">
                            🏌️ Low Golfer: {d.lowGolfer.golfer} ({d.lowGolfer.score}) → {d.lowGolfer.owner}
                          </div>
                        )}
                        {d.lowTeam && (
                          <div className="text-sm text-gray-600 ml-3">
                            👥 Low Team: {d.lowTeam.player} ({d.lowTeam.total})
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
              
              {/* Teams */}
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="bg-gradient-to-r from-slate-600 to-slate-700 px-4 py-3">
                  <h3 className="text-white font-bold">Team Rosters</h3>
                </div>
                <div className="divide-y divide-gray-100">
                  {Object.entries(t.teams || {}).map(([player, golfers]) => (
                    <div key={player} className="px-4 py-3">
                      <div className="font-semibold text-gray-800 mb-1">{player}</div>
                      <div className="text-sm text-gray-600">
                        {(golfers || []).join(', ')}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        }
        
        return (
          <div className="space-y-4">
            <button
              onClick={() => setView('settings')}
              className="text-blue-600 font-medium flex items-center gap-1"
            >
              ← Back to Settings
            </button>
            
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
              <h2 className="text-xl font-bold text-gray-800 mb-4">📜 Past Tournaments</h2>
              
              {tournamentHistory.length === 0 ? (
                <p className="text-gray-500 text-center py-8">No tournaments saved yet.</p>
              ) : (
                <div className="space-y-2">
                  {tournamentHistory.map(t => (
                    <button
                      key={t.id}
                      onClick={() => { setSelectedTournament(t); setEditingPayouts(false); }}
                      className="w-full text-left bg-gray-50 hover:bg-gray-100 rounded-lg p-4 transition-colors"
                    >
                      <div className="font-semibold text-gray-800">{t.name}</div>
                      <div className="text-sm text-gray-500">{new Date(t.date).toLocaleDateString()}</div>
                      {t.champion && (
                        <div className="text-sm text-emerald-600 mt-1">🏆 {t.champion}</div>
                      )}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="bg-gradient-to-r from-emerald-700 to-emerald-800 text-white px-4 py-4 shadow-lg">
            <div className="max-w-3xl mx-auto flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold">🏌️ Major Droppers</h1>
                <p className="text-emerald-200 text-sm">{tournamentName}</p>
              </div>
              <div className={`w-3 h-3 rounded-full ${connected ? 'bg-green-400' : 'bg-red-400'}`} title={connected ? 'Connected' : 'Disconnected'} />
            </div>
          </div>

          <div className="max-w-3xl mx-auto px-2 sm:px-4 py-4 pb-24">
            {syncing ? (
              <div className="text-center py-12">
                <div className="text-4xl mb-4">⏳</div>
                <p className="text-gray-500">Syncing with server...</p>
              </div>
            ) : (
              <>
                {view === 'dashboard' && <DashboardView />}
                {view === 'teams' && <TeamsView />}
                {view === 'scores' && <ScoresView />}
                {view === 'settings' && <SettingsView />}
                {view === 'history' && <HistoryView />}
                {view === 'draft-setup' && <DraftSetupView />}
                {view === 'draft' && draftMode && <DraftView />}
              </>
            )}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2 shadow-lg">
            <div className="max-w-3xl mx-auto flex justify-around">
              {[
                { id: 'dashboard', label: 'Home', icon: '📊' },
                { id: 'teams', label: 'Teams', icon: '👥' },
                { id: 'scores', label: 'Leaderboard', icon: '🏆' },
                { id: 'settings', label: 'More', icon: '⚙️' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => {
                    if (!draftMode || tab.id === 'settings') setView(tab.id);
                  }}
                  className={`flex flex-col items-center py-1 px-4 rounded-lg transition-colors ${
                    view === tab.id ? 'text-emerald-700' : draftMode && tab.id !== 'settings' ? 'text-gray-300 cursor-not-allowed' : 'text-gray-400 hover:text-gray-600'
                  }`}
                >
                  <span className="text-xl">{tab.icon}</span>
                  <span className="text-xs font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<MajorDroppers />, document.getElementById('root'));
  </script>
</body>
</html>
