<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DINGERS ONLY 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #121f17;
    --green-mid: #1a2e20;
    --green-light: #223828;
    --chalk: #f0ebe0;
    --chalk-dim: #a09880;
    --amber: #f0a820;
    --red: #d94040;
    --card-bg: rgba(255,255,255,0.035);
    --card-border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--green);
    background-image:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(240,168,32,0.07) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 47px, rgba(255,255,255,0.018) 47px, rgba(255,255,255,0.018) 48px),
      repeating-linear-gradient(90deg, transparent, transparent 47px, rgba(255,255,255,0.012) 47px, rgba(255,255,255,0.012) 48px);
    min-height: 100vh;
    color: var(--chalk);
    font-family: 'Barlow', sans-serif;
  }
  header {
    text-align: center; padding: 32px 20px 20px;
    border-bottom: 1px solid rgba(240,168,32,0.2);
    position: relative;
  }
  header::after {
    content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%);
    width:200px; height:2px; background:linear-gradient(to right,transparent,var(--amber),transparent);
  }
  .title-main { font-family:'Bebas Neue',sans-serif; font-size:clamp(52px,9vw,88px); letter-spacing:8px; line-height:1; text-shadow:0 0 60px rgba(240,168,32,0.3),4px 4px 0 rgba(0,0,0,0.6); }
  .title-year { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:10px; color:var(--amber); margin-top:2px; }
  nav { display:flex; justify-content:center; gap:2px; padding:14px 16px; background:rgba(0,0,0,0.2); border-bottom:1px solid rgba(255,255,255,0.05); flex-wrap:wrap; }
  .nav-btn { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; background:transparent; border:1px solid transparent; color:var(--chalk-dim); padding:7px 18px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .nav-btn:hover { color:var(--chalk); border-color:rgba(255,255,255,0.15); }
  .nav-btn.active { background:var(--amber); color:#111; border-color:var(--amber); }
  main { max-width:1100px; margin:0 auto; padding:24px 14px 80px; }
  .panel { display:none; animation:fadeIn 0.25s ease; }
  .panel.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .section-label { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:4px; color:var(--amber); margin-bottom:14px; display:flex; align-items:center; gap:10px; }
  .section-label::after { content:''; flex:1; height:1px; background:linear-gradient(to right,rgba(240,168,32,0.35),transparent); }

  /* STANDINGS */
  .standings-wrap { display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
  .stand-card { display:grid; grid-template-columns:44px 1fr 80px; align-items:center; gap:14px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:3px; padding:12px 18px; position:relative; overflow:hidden; transition:border-color 0.2s; }
  .stand-card:hover { border-color:rgba(240,168,32,0.25); }
  .stand-card.first { border-color:rgba(240,168,32,0.4); background:rgba(240,168,32,0.055); }
  .stand-card.first::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--amber); }
  .rank-n { font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--chalk-dim); text-align:center; }
  .first .rank-n { color:var(--amber); }
  .mgr-name { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:2px; }
  .mgr-sub { font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--chalk-dim); letter-spacing:1px; margin-top:1px; }
  .hr-big { font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--amber); text-align:right; line-height:1; }
  .hr-lbl { font-family:'Barlow Condensed',sans-serif; font-size:10px; color:var(--chalk-dim); letter-spacing:2px; text-align:right; }
  .bar-wrap { grid-column:1/-1; }
  .bar-bg { height:3px; background:rgba(255,255,255,0.07); border-radius:2px; overflow:hidden; }
  .bar-fill { height:100%; background:linear-gradient(to right,#c07a10,var(--amber)); transition:width 1s ease; }

  /* ROSTER */
  .mgr-tabs { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
  .tab-btn { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--chalk-dim); padding:5px 12px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .tab-btn:hover { color:var(--chalk); border-color:rgba(255,255,255,0.25); }
  .tab-btn.active { background:var(--green-light); border-color:var(--amber); color:var(--amber); }
  .roster-tbl { width:100%; border-collapse:collapse; font-family:'Barlow Condensed',sans-serif; }
  .roster-tbl th { font-size:10px; letter-spacing:2px; color:var(--chalk-dim); text-align:left; padding:7px 10px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .roster-tbl th:not(:first-child) { text-align:center; }
  .roster-tbl td { padding:9px 10px; font-size:14px; border-bottom:1px solid rgba(255,255,255,0.04); }
  .roster-tbl td:not(:first-child) { text-align:center; }
  .roster-tbl tr:hover td { background:rgba(255,255,255,0.025); }
  .pos-pill { display:inline-block; font-size:10px; font-weight:700; letter-spacing:1px; background:rgba(255,255,255,0.07); color:var(--chalk-dim); padding:2px 5px; border-radius:2px; margin-right:6px; min-width:26px; text-align:center; }
  .hr-num { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--amber); }
  .proj-num { color:var(--chalk-dim); }
  .diff-pos { font-family:'Bebas Neue',sans-serif; font-size:18px; color:#5dcc80; }
  .diff-neg { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--red); }
  .diff-zero { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--chalk-dim); }

  /* ACTIVITY */
  .act-list { display:flex; flex-direction:column; }
  .act-row { display:grid; grid-template-columns:60px 1fr 48px; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.04); transition:background 0.12s; }
  .act-row:hover { background:rgba(255,255,255,0.025); }
  .act-mgr { font-family:'Bebas Neue',sans-serif; font-size:15px; color:var(--amber); letter-spacing:1px; }
  .act-pos { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--chalk-dim); }
  .act-player { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:600; }
  .act-team { color:var(--chalk-dim); font-size:12px; }
  .act-hr { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--amber); text-align:right; }

  /* REFRESH */
  .refresh-row { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:14px; }
  .refresh-btn { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.12); color:var(--chalk-dim); padding:5px 12px; cursor:pointer; border-radius:2px; transition:all 0.15s; }
  .refresh-btn:hover { border-color:var(--amber); color:var(--amber); }
  .upd-txt { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:rgba(255,255,255,0.2); letter-spacing:1px; }

  /* DRAFT */
  .order-box { background:var(--card-bg); border:1px solid var(--card-border); border-radius:4px; padding:20px 24px; }
  .order-box h3 { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--amber); margin-bottom:6px; }
  .order-box p { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--chalk-dim); margin-bottom:16px; line-height:1.5; }
  .order-list { display:flex; flex-direction:column; gap:6px; margin-bottom:20px; }
  .order-item { display:grid; grid-template-columns:32px 1fr 28px; align-items:center; gap:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); border-radius:3px; padding:8px 14px; font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:600; cursor:grab; user-select:none; transition:background 0.12s; }
  .order-item:hover { background:rgba(255,255,255,0.07); }
  .order-num { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--amber); }
  .drag-handle { color:var(--chalk-dim); font-size:14px; text-align:right; }
  .btn-primary { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:3px; background:var(--amber); border:none; color:#111; padding:12px 32px; cursor:pointer; border-radius:3px; transition:background 0.15s,transform 0.1s; }
  .btn-primary:hover { background:#f8c040; }
  .btn-primary:active { transform:scale(0.98); }
  .btn-ghost { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; background:transparent; border:1px solid rgba(255,255,255,0.15); color:var(--chalk-dim); padding:8px 16px; cursor:pointer; border-radius:3px; transition:all 0.15s; }
  .btn-ghost:hover { border-color:var(--chalk); color:var(--chalk); }

  .draft-header { background:rgba(240,168,32,0.08); border:1px solid rgba(240,168,32,0.2); border-radius:4px; padding:16px 20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .pick-round { font-family:'Barlow Condensed',sans-serif; font-size:12px; letter-spacing:3px; color:var(--chalk-dim); }
  .pick-who { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:var(--amber); }
  .pick-open { font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--chalk-dim); letter-spacing:1px; margin-top:1px; }
  .snake-indicator { display:flex; gap:3px; flex-wrap:wrap; }
  .snake-pip { width:30px; height:30px; border-radius:2px; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:10px; letter-spacing:1px; background:rgba(255,255,255,0.05); color:var(--chalk-dim); border:1px solid rgba(255,255,255,0.07); transition:all 0.2s; }
  .snake-pip.done { background:rgba(240,168,32,0.12); color:var(--amber); border-color:rgba(240,168,32,0.25); }
  .snake-pip.cur { background:var(--amber); color:#111; border-color:var(--amber); }

  .pick-area { background:var(--card-bg); border:1px solid var(--card-border); border-radius:4px; padding:18px; margin-bottom:16px; }
  .pick-area h4 { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:2px; color:var(--chalk-dim); margin-bottom:12px; }
  .pf-row { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  .pf-btn { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; background:transparent; border:1px solid rgba(255,255,255,0.1); color:var(--chalk-dim); padding:4px 9px; cursor:pointer; border-radius:2px; transition:all 0.12s; }
  .pf-btn:hover { color:var(--chalk); border-color:rgba(255,255,255,0.25); }
  .pf-btn.active { background:var(--green-light); border-color:var(--amber); color:var(--amber); }

  .player-pool { display:flex; flex-direction:column; max-height:360px; overflow-y:auto; border:1px solid rgba(255,255,255,0.07); border-radius:3px; }
  .player-pool::-webkit-scrollbar { width:4px; }
  .player-pool::-webkit-scrollbar-track { background:rgba(0,0,0,0.15); }
  .player-pool::-webkit-scrollbar-thumb { background:rgba(240,168,32,0.3); border-radius:2px; }

  .pool-row { display:grid; grid-template-columns:1fr 52px 48px 72px; align-items:center; padding:9px 12px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:background 0.1s; }
  .pool-row:hover:not(.taken) { background:rgba(240,168,32,0.07); }
  .pool-row.taken { opacity:0.28; pointer-events:none; }
  .pool-name { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:600; }
  .pool-meta { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--chalk-dim); }
  .pool-proj-num { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--amber); text-align:center; }
  .pool-proj-lbl { font-family:'Barlow Condensed',sans-serif; font-size:9px; color:var(--chalk-dim); letter-spacing:1px; text-align:center; margin-top:-2px; }
  .pool-pick-btn { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; background:var(--amber); border:none; color:#111; padding:5px 10px; cursor:pointer; border-radius:2px; transition:background 0.12s; }
  .pool-pick-btn:hover { background:#f8c040; }

  .draft-log-hd { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; color:var(--chalk-dim); margin-bottom:8px; }
  .log-list { display:flex; flex-direction:column; max-height:180px; overflow-y:auto; border:1px solid rgba(255,255,255,0.06); border-radius:3px; }
  .log-item { display:grid; grid-template-columns:80px 44px 1fr 52px; gap:0; padding:7px 10px; border-bottom:1px solid rgba(255,255,255,0.04); font-family:'Barlow Condensed',sans-serif; font-size:13px; }
  .log-mgr { font-weight:700; color:var(--amber); }
  .log-pos-col { color:var(--chalk-dim); }
  .log-proj-col { color:var(--chalk-dim); text-align:right; }

  .draft-done-banner { background:rgba(93,204,128,0.08); border:1px solid rgba(93,204,128,0.25); border-radius:4px; padding:18px 24px; margin-bottom:18px; text-align:center; }
  .draft-done-banner h3 { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:#5dcc80; margin-bottom:4px; }
  .draft-done-banner p { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--chalk-dim); }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:200; display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#1c3022; border:1px solid rgba(240,168,32,0.3); border-radius:6px; padding:26px; min-width:300px; max-width:400px; width:92%; }
  .modal-box h3 { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; color:var(--amber); margin-bottom:4px; }
  .modal-box p { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--chalk-dim); margin-bottom:16px; }
  .modal-pos-btns { display:flex; flex-wrap:wrap; gap:6px; }
  .mpos-btn { font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:1px; background:transparent; border:1.5px solid rgba(255,255,255,0.15); color:var(--chalk-dim); padding:8px 13px; cursor:pointer; border-radius:3px; transition:all 0.15s; }
  .mpos-btn:hover { border-color:var(--amber); color:var(--amber); }
  .mpos-btn.dimmed { opacity:0.3; cursor:default; }
  .mpos-btn.eligible { border-color:rgba(240,168,32,0.4); color:var(--chalk); }

  .empty-msg { text-align:center; padding:48px 20px; }
  .empty-msg strong { display:block; font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--amber); letter-spacing:3px; margin-bottom:6px; }
  .empty-msg span { font-family:'Barlow Condensed',sans-serif; font-size:14px; color:var(--chalk-dim); }
  .loading-pulse { text-align:center; padding:32px; font-family:'Barlow Condensed',sans-serif; font-size:13px; letter-spacing:2px; color:var(--chalk-dim); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  @media(max-width:560px) {
    .stand-card { grid-template-columns:36px 1fr 60px; }
    .hr-big { font-size:28px; }
    .pool-row { grid-template-columns:1fr 44px 38px 60px; }
    .log-item { grid-template-columns:64px 36px 1fr 44px; }
  }
</style>
</head>
<body>
<header>
  <div class="title-main">DINGERS ONLY</div>
  <div class="title-year">2026 · MLB HOME RUN LEAGUE</div>
</header>
<nav>
  <button class="nav-btn active" onclick="showPanel('standings',this)">Standings</button>
  <button class="nav-btn" onclick="showPanel('roster',this)">Rosters</button>
  <button class="nav-btn" onclick="showPanel('activity',this)">Top Dingers</button>
  <button class="nav-btn" onclick="showPanel('draft',this)">Draft</button>
</nav>
<main>
  <div id="panel-standings" class="panel active">
    <div class="refresh-row">
      <span class="upd-txt" id="upd-txt">Not refreshed yet</span>
      <button class="refresh-btn" onclick="loadLive()">⟳ Refresh</button>
    </div>
    <div class="section-label">Standings</div>
    <div id="standings-wrap"><div class="loading-pulse">LOADING...</div></div>
  </div>
  <div id="panel-roster" class="panel">
    <div class="section-label">Rosters</div>
    <div class="mgr-tabs" id="roster-tabs"></div>
    <div id="roster-body"></div>
  </div>
  <div id="panel-activity" class="panel">
    <div class="section-label">Top Dingers</div>
    <div id="activity-body"></div>
  </div>
  <div id="panel-draft" class="panel">
    <div class="section-label">Snake Draft</div>
    <div id="draft-body"></div>
  </div>
</main>

<!-- Position modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title">ASSIGN POSITION</h3>
    <p id="modal-sub"></p>
    <div class="modal-pos-btns" id="modal-pos-btns"></div>
    <div style="margin-top:14px">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

// Build unique player map: { name -> { name, team, positions[], maxProj, projByPos{} } }
function buildUniqueMap() {
  const map = {};
  RAW_POOL.forEach(([name,team,pos,proj]) => {
    if (!map[name]) map[name] = { name, team, positions:[], projByPos:{}, maxProj:0 };
    map[name].positions.push(pos);
    map[name].projByPos[pos] = proj;
    if (proj > map[name].maxProj) map[name].maxProj = proj;
  });
  return map;
}
const UNIQUE_MAP = buildUniqueMap();
const UNIQUE_LIST = Object.values(UNIQUE_MAP).sort((a,b) => b.maxProj - a.maxProj);

function poolForPos(pos) {
  if (pos === 'ALL') return UNIQUE_LIST;
  return RAW_POOL.filter(r => r[2] === pos)
    .map(([name,team,p,proj]) => ({
      name, team, positions: UNIQUE_MAP[name]?.positions || [p],
      projByPos: UNIQUE_MAP[name]?.projByPos || {[p]:proj}, maxProj: proj
    }))
    .sort((a,b) => b.maxProj - a.maxProj);
}

// ── STATE ────────────────────────────────────────────────
function mkState() {
  return {
    order: [...MANAGERS],
    started: false,
    picks: [], // {idx,mgr,player,team,pos,proj}
    roster: Object.fromEntries(MANAGERS.map(m=>[m,Object.fromEntries(POSITIONS.map(p=>[p,null]))]))
  };
}
let S = (() => { try { const r=localStorage.getItem(SK); return r?JSON.parse(r):mkState(); } catch(e){return mkState();} })();
function save() { try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){} }

let liveHR = {};
let rMgr = MANAGERS[0];
let pf = 'ALL';
let pendingPlayer = null;

// ── SNAKE ORDER ─────────────────────────────────────────
function snakeOrder() {
  const o = [];
  for (let r=0; r<POSITIONS.length; r++) {
    const round = r%2===0 ? [...S.order] : [...S.order].reverse();
    round.forEach(m => o.push({mgr:m, round:r+1}));
  }
  return o;
}
function curPickIdx() { return S.picks.length; }
function curPick() { return snakeOrder()[curPickIdx()]; }
function isDone() { return S.picks.length >= TOTAL_PICKS; }
function taken() { return new Set(S.picks.map(p=>p.player)); }
function openPos(mgr) { return POSITIONS.filter(p=>S.roster[mgr][p]===null); }

// ── LIVE DATA ────────────────────────────────────────────
async function loadLive() {
  document.getElementById('upd-txt').textContent = 'Fetching...';
  try {
    const res = await fetch('https://site.web.api.espn.com/apis/common/v3/sports/baseball/mlb/statistics/athletes?region=us&lang=en&contentorigin=espn&isqualified=false&limit=500&page=1&category=homeRuns&seasontype=2&sort=homeRuns%3Adesc');
    if (!res.ok) throw new Error();
    const j = await res.json();
    liveHR = {};
    (j?.athletes||[]).forEach(e => {
      const a = e.athlete||e;
      const full = (a.displayName||'').toUpperCase();
      const hrs = parseInt(e.statistics?.[0]?.value)||0;
      liveHR[full] = hrs;
      liveHR[full.split(' ').slice(-1)[0]] = hrs;
    });
    document.getElementById('upd-txt').textContent = 'Updated ' + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('upd-txt').textContent = 'Season not yet started';
  }
  renderStandings(); renderRoster(); renderActivity();
}

function getHR(name) {
  if (!name) return null;
  const u = name.toUpperCase();
  if (liveHR[u]!==undefined) return liveHR[u];
  const last = u.split(' ').slice(-1)[0];
  if (liveHR[last]!==undefined) return liveHR[last];
  return null;
}

// ── STANDINGS ────────────────────────────────────────────
function renderStandings() {
  const data = MANAGERS.map(m => {
    let tot=0,proj=0,cnt=0;
    POSITIONS.forEach(p => {
      const pk = S.roster[m][p];
      if (pk) { tot+=(getHR(pk.player)??0); proj+=pk.proj||0; cnt++; }
    });
    return {mgr:m,tot,proj,cnt};
  }).sort((a,b)=>b.tot-a.tot);

  const wrap = document.getElementById('standings-wrap');
  if (!data.some(d=>d.cnt>0)) {
    wrap.innerHTML='<div class="empty-msg"><strong>NO DRAFT YET</strong><span>Head to the Draft tab to get started.</span></div>';
    return;
  }
  const mx = Math.max(...data.map(d=>d.tot),1);
  wrap.innerHTML = data.map((d,i) => `
    <div class="stand-card ${i===0?'first':''}">
      <div class="rank-n">${i+1}</div>
      <div><div class="mgr-name">${d.mgr}</div><div class="mgr-sub">${d.cnt} players · ${d.proj} projected</div></div>
      <div><div class="hr-big">${d.tot}</div><div class="hr-lbl">HOME RUNS</div></div>
      <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" style="width:${(d.tot/mx*100).toFixed(1)}%"></div></div></div>
    </div>`).join('');
}

// ── ROSTER ───────────────────────────────────────────────
function renderRoster() {
  document.getElementById('roster-tabs').innerHTML = MANAGERS.map(m =>
    `<button class="tab-btn ${m===rMgr?'active':''}" onclick="switchRMgr('${m}')">${m}</button>`).join('');
  const picks = S.roster[rMgr];
  const hasPicks = POSITIONS.some(p=>picks[p]!==null);
  const body = document.getElementById('roster-body');
  if (!hasPicks) { body.innerHTML='<div class="empty-msg"><strong>NO PICKS YET</strong><span>'+rMgr+" hasn't drafted.</span></div>"; return; }
  const rows = POSITIONS.map(pos => {
    const pk = picks[pos];
    if (!pk) return `<tr><td><span class="pos-pill">${pos}</span><span style="color:var(--chalk-dim)">—</span></td><td>—</td><td>—</td><td>—</td></tr>`;
    const hr = getHR(pk.player);
    const diff = hr!==null&&pk.proj ? hr-pk.proj : null;
    const dc = diff===null?'diff-zero':diff>0?'diff-pos':diff<0?'diff-neg':'diff-zero';
    const ds = diff===null?'—':diff>0?'+'+diff:diff<0?String(diff):'0';
    return `<tr><td><span class="pos-pill">${pos}</span><strong>${pk.player}</strong> <span style="color:var(--chalk-dim);font-size:12px">(${pk.team})</span></td><td class="hr-num">${hr!==null?hr:'—'}</td><td class="proj-num">${pk.proj||'—'}</td><td class="${dc}">${ds}</td></tr>`;
  }).join('');
  body.innerHTML=`<table class="roster-tbl"><thead><tr><th>PLAYER</th><th>HR</th><th>PROJ</th><th>+/−</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function switchRMgr(m){rMgr=m;renderRoster();}

// ── ACTIVITY ─────────────────────────────────────────────
function renderActivity() {
  const all=[];
  MANAGERS.forEach(m=>POSITIONS.forEach(pos=>{
    const pk=S.roster[m][pos];
    if(pk) all.push({mgr:m,pos,...pk,hr:getHR(pk.player)??0});
  }));
  const body=document.getElementById('activity-body');
  if(!all.length){body.innerHTML='<div class="empty-msg"><strong>NO PICKS YET</strong><span>Draft first to track dingers.</span></div>';return;}
  all.sort((a,b)=>b.hr-a.hr);
  body.innerHTML='<div class="act-list">'+all.map(p=>`<div class="act-row"><div><div class="act-mgr">${p.mgr}</div><div class="act-pos">${p.pos}</div></div><div><div class="act-player">${p.player}</div><div class="act-team">${p.team}</div></div><div class="act-hr">${p.hr}</div></div>`).join('')+'</div>';
}

// ── DRAFT ────────────────────────────────────────────────
function renderDraft() {
  const body = document.getElementById('draft-body');
  if (!S.started) { renderOrderSetup(body); return; }
  renderDraftBoard(body);
}

function renderOrderSetup(body) {
  body.innerHTML=`<div class="order-box">
    <h3>Set Draft Order</h3>
    <p>Drag to reorder, or click <strong style="color:var(--amber)">Randomize</strong>.<br>Round 1 order — snake reverses each round.</p>
    <div class="order-list" id="order-list">
      ${S.order.map((m,i)=>`<div class="order-item" draggable="true" data-mgr="${m}">
        <div class="order-num">${i+1}</div><div>${m}</div><div class="drag-handle">⠿</div>
      </div>`).join('')}
    </div>
    <button class="btn-primary" onclick="startDraft()">START DRAFT</button>
    &nbsp;<button class="btn-ghost" onclick="randomOrder()">Randomize</button>
  </div>`;
  initDrag();
}

function initDrag() {
  const list=document.getElementById('order-list');
  if(!list)return;
  let dragged=null;
  list.querySelectorAll('.order-item').forEach(el=>{
    el.addEventListener('dragstart',()=>{dragged=el;el.style.opacity='0.4';});
    el.addEventListener('dragend',()=>{el.style.opacity='';dragged=null;});
    el.addEventListener('dragover',e=>{e.preventDefault();if(dragged&&dragged!==el)el.before(dragged);});
    el.addEventListener('drop',()=>{
      S.order=[...list.querySelectorAll('.order-item')].map(e=>e.dataset.mgr);
      save();renderDraft();
    });
  });
}

function randomOrder() {
  for(let i=S.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.order[i],S.order[j]]=[S.order[j],S.order[i]];}
  save();renderDraft();
}

function startDraft(){S.started=true;save();renderDraft();}

function renderDraftBoard(body) {
  const so = snakeOrder();
  const pidx = curPickIdx();
  const done = isDone();
  const tk = taken();

  // header
  let hdr='';
  if(!done){
    const cp=curPick();
    const currRound=cp.round;
    const rs=(currRound-1)*MANAGERS.length;
    const pips=so.slice(rs,rs+MANAGERS.length).map((_,i)=>{
      const ai=rs+i; const cls=ai<pidx?'done':ai===pidx?'cur':'';
      return `<div class="snake-pip ${cls}">${so[ai].mgr.slice(0,3)}</div>`;
    }).join('');
    const op=openPos(cp.mgr).join(' · ');
    hdr=`<div class="draft-header">
      <div><div class="pick-round">ROUND ${currRound} of ${POSITIONS.length} &nbsp;·&nbsp; PICK ${pidx+1} of ${TOTAL_PICKS}</div>
      <div class="pick-who">${cp.mgr}'S PICK</div>
      <div class="pick-open">Open slots: ${op}</div></div>
      <div><div style="font-family:Barlow Condensed,sans-serif;font-size:10px;color:var(--chalk-dim);letter-spacing:2px;margin-bottom:4px">THIS ROUND</div>
      <div class="snake-indicator">${pips}</div></div>
    </div>`;
  } else {
    hdr=`<div class="draft-done-banner"><h3>DRAFT COMPLETE</h3><p>All ${TOTAL_PICKS} picks made. Track the season on Standings.</p></div>`;
  }

  // player pool
  const pfBtns=['ALL',...POSITIONS].map(p=>`<button class="pf-btn ${pf===p?'active':''}" onclick="setPF('${p}')">${p}</button>`).join('');
  const pool=poolForPos(pf);
  const poolHTML = pool.slice(0,120).map(pl=>{
    const isTaken=tk.has(pl.name);
    const proj = pl.projByPos?.[pf] ?? pl.maxProj;
    return `<div class="pool-row ${isTaken?'taken':''}">
      <div><div class="pool-name">${pl.name}</div><div class="pool-meta">${pl.team} · ${pl.positions.join('/')}</div></div>
      <div><div class="pool-proj-num">${proj}</div><div class="pool-proj-lbl">HR PROJ</div></div>
      <div></div>
      <div>${!done&&!isTaken?`<button class="pool-pick-btn" onclick="initPick(${JSON.stringify(pl.name)},${JSON.stringify(pl.team)},${proj})">PICK</button>`
        :isTaken?'<span style="font-family:Barlow Condensed;font-size:10px;color:var(--chalk-dim)">TAKEN</span>':''}</div>
    </div>`;
  }).join('');

  // log
  const logHTML=[...S.picks].reverse().slice(0,25).map(p=>
    `<div class="log-item"><span class="log-mgr">${p.mgr}</span><span class="log-pos-col">${p.pos}</span><span>${p.player}</span><span class="log-proj-col">${p.proj}HR</span></div>`
  ).join('');

  body.innerHTML=`${hdr}
    ${!done?`<div class="pick-area"><h4>AVAILABLE PLAYERS</h4>
      <div class="pf-row">${pfBtns}</div>
      <div class="player-pool">${poolHTML||'<div style="padding:20px;text-align:center;color:var(--chalk-dim);font-family:Barlow Condensed">No players listed at this position</div>'}</div>
    </div>`:''}
    <div><div class="draft-log-hd">PICK LOG (${S.picks.length}/${TOTAL_PICKS})</div>
    <div class="log-list">${logHTML||'<div style="padding:14px;text-align:center;color:var(--chalk-dim);font-family:Barlow Condensed;font-size:13px">No picks yet</div>'}</div></div>
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn-ghost" onclick="undoPick()">↩ Undo</button>
      <button class="btn-ghost" onclick="tryReset()">Reset Draft</button>
    </div>`;
}

function setPF(p){pf=p;renderDraft();}

function initPick(name,team,proj) {
  if(isDone())return;
  const cp=curPick();
  const op=openPos(cp.mgr);
  const eligible=RAW_POOL.filter(r=>r[0]===name).map(r=>r[2]).filter(pos=>op.includes(pos));

  if(eligible.length===1){confirmPick(name,team,proj,eligible[0]);return;}

  pendingPlayer={name,team,proj};
  document.getElementById('modal-title').textContent=name.toUpperCase();
  document.getElementById('modal-sub').textContent=`Assign a position for ${cp.mgr}`;

  const btns=op.map(pos=>{
    const ok=eligible.includes(pos);
    return `<button class="mpos-btn ${ok?'eligible':'dimmed'}" ${ok?`onclick="confirmPick(${JSON.stringify(name)},${JSON.stringify(team)},${proj},'${pos}')"`:''} title="${ok?'':'Not listed at this position — use Force below'}">${pos}</button>`;
  }).join('')+`<button class="mpos-btn" style="margin-top:6px;border-color:rgba(255,255,255,0.25);color:var(--chalk-dim)" onclick="forcePos(${JSON.stringify(name)},${JSON.stringify(team)},${proj})">Force any slot ↓</button>`;
  document.getElementById('modal-pos-btns').innerHTML=btns;
  document.getElementById('modal-overlay').classList.add('open');
}

function forcePos(name,team,proj){
  const cp=curPick(); const op=openPos(cp.mgr);
  document.getElementById('modal-pos-btns').innerHTML=op.map(pos=>
    `<button class="mpos-btn eligible" onclick="confirmPick(${JSON.stringify(name)},${JSON.stringify(team)},${proj},'${pos}')">${pos}</button>`
  ).join('');
}

function closeModal(){document.getElementById('modal-overlay').classList.remove('open');pendingPlayer=null;}

function confirmPick(name,team,proj,pos){
  closeModal();
  const cp=curPick();
  if(!cp)return;
  S.roster[cp.mgr][pos]={player:name,team,proj};
  S.picks.push({idx:S.picks.length,mgr:cp.mgr,player:name,team,pos,proj});
  save(); renderDraft(); renderStandings();
}

function undoPick(){
  if(!S.picks.length)return;
  const last=S.picks.pop();
  S.roster[last.mgr][last.pos]=null;
  save(); renderDraft(); renderStandings();
}

function tryReset(){if(confirm('Reset the entire draft? All picks will be cleared.'))resetDraft();}
function resetDraft(){S=mkState();save();renderDraft();renderStandings();renderRoster();renderActivity();}

// ── NAV ──────────────────────────────────────────────────
function showPanel(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='roster')renderRoster();
  if(name==='activity')renderActivity();
  if(name==='draft')renderDraft();
  if(name==='standings')renderStandings();
}

// ── INIT ─────────────────────────────────────────────────
renderStandings();
loadLive();
</script>
