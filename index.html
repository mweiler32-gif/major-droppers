    // Helper function to normalize names for matching (removes diacritics)
    const normalizeName = (name) => {
      if (!name) return '';
      return name
        // Handle Nordic characters that don't decompose with NFD
        .replace(/[øØ]/g, 'o')
        .replace(/[æÆ]/g, 'ae')
        .replace(/[åÅ]/g, 'a')
        .replace(/[ðÐ]/g, 'd')
        .replace(/[þÞ]/g, 'th')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // Remove combining diacritics
        .toLowerCase()
        .replace(/[^a-z\s]/g, '') // Keep only letters and spaces
        .replace(/\s+/g, ' ')
        .trim();
    };
    
    // Helper to check if two names match (handles diacritics)
    const namesMatch = (name1, name2) => {
      const n1 = normalizeName(name1);
      const n2 = normalizeName(name2);
      if (!n1 || !n2) return false;
      return n1 === n2 || n1.includes(n2) || n2.includes(n1);
    };

    const generateSnakeOrder = (players) => {
      const order = [];
      for (let round = 0; round < ROSTER_SIZE; round++) {
        if (round % 2 === 0) {
          order.push(...players);
        } else {
          order.push(...[...players].reverse());
        }
      }
      return order;
    };
    
    // Helper to find score data with fuzzy name matching (handles diacritics)
    const getGolferScoreFromScores = (scores, golferName) => {
      if (!golferName) return {};
      // First try exact match
      if (scores[golferName]) return scores[golferName];
      // Then try fuzzy match
      const matchingKey = Object.keys(scores).find(key => namesMatch(key, golferName));
      return matchingKey ? scores[matchingKey] : {};
    };

    function MajorDroppers() {
      const [players, setPlayers] = useState(DEFAULT_PLAYERS);
      const [teams, setTeams] = useState(() => {
        const initial = {};
        DEFAULT_PLAYERS.forEach(p => initial[p] = []);
        return initial;
      });
      const [scores, setScores] = useState({});
      const [currentRound, setCurrentRound] = useState(0);
      const [tournamentName, setTournamentName] = useState('2026 U.S. Open');
      const [view, setView] = useState('dashboard');
      const [champion, setChampion] = useState(null);
      const [connected, setConnected] = useState(false);
      const [syncing, setSyncing] = useState(true);
      const [detectedEvent, setDetectedEvent] = useState(null); // { name, dateParam }
      const [oddsMap, setOddsMap] = useState({}); // normalizedName -> { name, price, impliedProb, book }
      const [oddsStatus, setOddsStatus] = useState('');

      // Draft engine — append-only pick log; teams / turn / available are all DERIVED from it
      const COMMISSIONER = 'WEILER';
      const [myIdentity, setMyIdentity] = useState(() => { try { return localStorage.getItem('md_identity') || ''; } catch(e) { return ''; } });
      const [draftActive, setDraftActive] = useState(false);
      const [draftOrder, setDraftOrder] = useState([]);   // full snake sequence of manager names
      const [draftField, setDraftField] = useState([]);   // golfer pool set at draft start
      const [picks, setPicks] = useState([]);             // ordered [{ n, manager, golfer, ts }]
      const [pendingPick, setPendingPick] = useState(null); // golfer tapped, awaiting confirm
      const [golferInput, setGolferInput] = useState('');
      const [draftOrderInput, setDraftOrderInput] = useState(DEFAULT_PLAYERS.join(', '));
      const [searchTerm, setSearchTerm] = useState('');
      const [parseStatus, setParseStatus] = useState('');
      const [editingTeam, setEditingTeam] = useState(null); // Track which team is being edited
      const isCommissioner = myIdentity === COMMISSIONER;
      const [espnEventId, setEspnEventId] = useState(() => { try { return localStorage.getItem('md_event_id') || ''; } catch(e) { return ''; } });
      
      // Google Sheets integration for live ESPN scores
      const [sheetUrl, setSheetUrl] = useState('https://docs.google.com/spreadsheets/d/e/2PACX-1vQ121Dx0jInZVi40FINWYApShk7Hy1IQU316o3zFhNaebyRVOf4Zb701Y8To6T6nrSV8FA124Mfc7DA/pub?output=csv');
      const [liveScores, setLiveScores] = useState([]);
      const [lastFetch, setLastFetch] = useState(null);
      const [fetchError, setFetchError] = useState('');
      const [isFetching, setIsFetching] = useState(false);
      const [cutLine, setCutLine] = useState(null);
      const [tournamentRound, setTournamentRound] = useState(0); // 0=pre, 1-4=rounds
      const [tournamentHistory, setTournamentHistory] = useState([]); // Past tournament results
      
      // Track if we're currently writing to prevent loops
      const isWriting = useRef(false);
      const detectedDateRef = useRef(null); // holds YYYYMMDD so interval fetches aren't stale
      const detectedEventIdRef = useRef(null); // holds ESPN event id so scoring pins to the right tournament

      // Connect to Firebase and listen for changes
      useEffect(() => {
        const gameRef = database.ref('game');
        
        // Listen for real-time updates
        gameRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data && !isWriting.current) {
            if (data.teams) setTeams(data.teams);
            if (data.scores) setScores(data.scores);
            if (data.tournamentName) setTournamentName(data.tournamentName);
            if (data.champion !== undefined) setChampion(data.champion);
          }
          setConnected(true);
          setSyncing(false);
        });
        
        // Load tournament history
        const historyRef = database.ref('history');
        historyRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const historyArray = Object.entries(data).map(([key, val]) => ({
              id: key,
              ...val
            })).sort((a, b) => new Date(b.date) - new Date(a.date));
            setTournamentHistory(historyArray);
          }
        });

        // Connection state
        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', (snap) => {
          setConnected(snap.val() === true);
        });

        return () => {
          gameRef.off();
          historyRef.off();
          connectedRef.off();
        };
      }, []);

      // Persist this device's identity locally
      useEffect(() => { try { localStorage.setItem('md_identity', myIdentity || ''); } catch(e) {} }, [myIdentity]);
      useEffect(() => { try { localStorage.setItem('md_event_id', espnEventId || ''); } catch(e) {} }, [espnEventId]);

      // Dedicated draft listener — NOT gated by isWriting, so picks always sync in real time
      useEffect(() => {
        const draftRef = database.ref('game/draft');
        draftRef.on('value', (snap) => {
          const d = snap.val() || {};
          setDraftActive(d.active === true);
          setDraftOrder(d.order || []);
          setDraftField(d.field || []);
          setPicks(d.picks ? Object.values(d.picks).filter(Boolean).sort((a, b) => a.n - b.n) : []);
        });
        return () => draftRef.off();
      }, []);

      // Move everyone into the draft when it starts, and out when it ends
      useEffect(() => {
        if (draftActive) setView('draft');
        else if (view === 'draft') setView('teams');
      }, [draftActive]);

      // Keep local teams in sync with the pick log while drafting
      useEffect(() => {
        if (!draftActive) return;
        const t = {}; players.forEach(p => t[p] = []);
        picks.forEach(p => { if (t[p.manager]) t[p.manager].push(p.golfer); });
        setTeams(t);
      }, [picks, draftActive]);

      // Save to Firebase when data changes
      const saveToFirebase = async (updates) => {
        isWriting.current = true;
        try {
          await database.ref('game').update(updates);
          // Give Firebase listener time to process before accepting updates again
          await new Promise(resolve => setTimeout(resolve, 1000));
        } catch (err) {
          console.error('Firebase save error:', err);
        }
        isWriting.current = false;
      };

      // Detect the live-or-next PGA event from ESPN's season calendar
      const detectUpcomingEvent = async () => {
        const toParam = (dt) => {
          const d = new Date(dt);
          return `${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}`;
        };
        const pickFrom = (norm, now) => {
          // 1) event whose window contains now  2) next upcoming  3) most recent
          let pick = norm.find(e => now >= e.start && now < e.end);
          if (!pick) pick = norm.filter(e => e.start > now).sort((a, b) => a.start - b.start)[0];
          if (!pick) pick = norm.slice().sort((a, b) => b.start - a.start)[0];
          return pick || null;
        };
        const now = Date.now();
        try {
          // The full season calendar is embedded in the scoreboard response,
          // regardless of which event ESPN currently considers "live".
          const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard');
          if (!res.ok) throw new Error('scoreboard fetch failed');
          const data = await res.json();
          const cal = (data.leagues && data.leagues[0] && data.leagues[0].calendar) || [];
          const norm = cal
            .filter(c => c.startDate)
            .map(c => {
              let eventId = null;
              const ref = c.event && (c.event.$ref || c.event.ref);
              if (ref) { const m = String(ref).match(/events\/(\d+)/); if (m) eventId = m[1]; }
              if (!eventId && c.id) eventId = String(c.id);
              return {
                name: c.label || c.value || 'Tournament',
                start: new Date(c.startDate).getTime(),
                end: c.endDate ? new Date(c.endDate).getTime() : new Date(c.startDate).getTime(),
                dateParam: toParam(c.startDate),
                eventId
              };
            });
          console.log('Calendar events found:', norm.length);
          if (norm.length === 0) throw new Error('empty calendar');
          const pick = pickFrom(norm, now);
          console.log('Detected event:', pick && pick.name, '→ id=' + (pick && pick.eventId) + ' dates=' + (pick && pick.dateParam));
          return pick;
        } catch (err) {
          console.warn('Calendar detection failed — no event pinned:', err);
          return null;
        }
      };

      // Build the leaderboard URL, pinned to a specific ESPN event id so scoring always reads
      // the right tournament. The bare endpoint reverts to a default event between rounds.
      const espnLeaderboardUrl = () => {
        const base = 'https://site.api.espn.com/apis/site/v2/sports/golf/leaderboard?league=pga';
        const id = espnEventId || detectedEventIdRef.current;
        return id ? `${base}&event=${id}` : base;
      };

      // Run detection once on mount
      useEffect(() => {
        detectUpcomingEvent().then(ev => {
          if (ev) {
            setDetectedEvent(ev);
            detectedDateRef.current = ev.dateParam;
            detectedEventIdRef.current = ev.eventId || null;
            console.log('Detected event:', ev.name, '→ id=' + ev.eventId + ' dates=' + ev.dateParam);
            if (Object.values(teams).some(t => t.length > 0)) fetchLiveScores();
          }
        });
      }, []);

      // American odds -> implied win probability (handles negative favorites)
      const americanToImplied = (price) => {
        if (price === null || price === undefined || isNaN(price)) return 0;
        return price > 0 ? 100 / (price + 100) : (-price) / ((-price) + 100);
      };

      // Fetch outright win odds, auto-discovering the active golf market.
      // Uses CONSENSUS (median across all US books) so one book's bad/sentinel price can't skew a player.
      const fetchWinOdds = async () => {
        setOddsStatus('⏳ Loading odds...');
        try {
          // 1) discover active golf winner market (free — doesn't count against quota)
          const sportsRes = await fetch(`https://api.the-odds-api.com/v4/sports/?apiKey=${ODDS_API_KEY}`);
          if (!sportsRes.ok) throw new Error('sports list failed');
          const sports = await sportsRes.json();
          const golfMarkets = sports.filter(s => s.group === 'Golf' && s.has_outrights && s.active);
          if (golfMarkets.length === 0) throw new Error('no active golf winner market');

          // prefer the one matching our detected event, else first
          let market = golfMarkets[0];
          if (detectedEvent?.name) {
            const ev = normalizeName(detectedEvent.name);
            const matched = golfMarkets.find(s => {
              const t = normalizeName((s.title || '').replace(/winner/i, ''));
              return t && (ev.includes(t) || t.includes(ev) || (ev.includes('open') && t.includes('open') && !t.includes('us open')));
            });
            if (matched) market = matched;
          }

          // 2) fetch outright odds for that market (one region = one request, many books)
          const oddsRes = await fetch(`https://api.the-odds-api.com/v4/sports/${market.key}/odds?regions=us&markets=outrights&oddsFormat=american&apiKey=${ODDS_API_KEY}`);
          if (!oddsRes.ok) throw new Error('odds fetch failed');
          const oddsData = await oddsRes.json();
          const event = oddsData[0];
          if (!event) throw new Error('no odds event returned');

          // 3) collect every book's price per player
          const byPlayer = {};
          (event.bookmakers || []).forEach(b => {
            const oc = ((b.markets || []).find(m => m.key === 'outrights') || {}).outcomes || [];
            oc.forEach(o => {
              if (typeof o.price !== 'number' || isNaN(o.price)) return;
              const k = normalizeName(o.name);
              if (!k) return;
              if (!byPlayer[k]) byPlayer[k] = { name: o.name, prices: [] };
              byPlayer[k].prices.push(o.price);
            });
          });

          // 4) best line = shortest (lowest) price across books.
          // This feed carries high-side junk/sentinel numbers, so the real price is the lowest.
          const bestPrice = (prices) => prices.reduce((m, p) => (p < m ? p : m), Infinity);

          const map = {};
          Object.entries(byPlayer).forEach(([k, v]) => {
            const price = bestPrice(v.prices);
            map[k] = { name: v.name, price, impliedProb: americanToImplied(price), samples: v.prices.length };
          });

          // Diagnostics — see what the feed actually contains
          (event.bookmakers || []).forEach(b => {
            const oc = ((b.markets || []).find(m => m.key === 'outrights') || {}).outcomes || [];
            console.log('ODDS book', b.key, '→', oc.length, 'players');
          });
          ['cameron young', 'scottie scheffler', 'rory mcilroy'].forEach(k => {
            if (byPlayer[k]) console.log('ODDS samples', k, '→ best', bestPrice(byPlayer[k].prices), '| all', byPlayer[k].prices.slice().sort((a, b) => a - b));
          });

          const bookCount = (event.bookmakers || []).length;
          setOddsMap(map);
          setOddsStatus(`✓ Best-line odds from ${bookCount} books (${Object.keys(map).length} players)`);
          return map;
        } catch (err) {
          console.warn('fetchWinOdds failed:', err);
          setOddsStatus('⚠ Could not load odds');
          return {};
        }
      };

      // Look up a golfer's odds with fuzzy name matching (handles diacritics)
      const getGolferOdds = (name, map = oddsMap) => {
        const key = normalizeName(name);
        if (map[key]) return map[key];
        const fuzzy = Object.keys(map).find(k => namesMatch(k, name));
        return fuzzy ? map[fuzzy] : null;
      };

      // Format american odds for display (+300 / -150)
      const fmtOdds = (price) => (price > 0 ? `+${price}` : `${price}`);

      // Fetch scores from ESPN API
      const fetchLiveScores = async () => {
        setIsFetching(true);
        setFetchError('');
        try {
          const response = await fetch(espnLeaderboardUrl());
          if (!response.ok) throw new Error('ESPN API failed');
          const data = await response.json();
          const event = data && data.events && data.events[0];
          if (!event) throw new Error('No event data');
          console.log('Scoring event:', event.name, '| id', event.id, '| url', espnLeaderboardUrl());

          const competition = event.competitions && event.competitions[0];
          const competitors = (competition && competition.competitors) || [];
          const status = competition && competition.status;
          const detectedRound = (status && status.period) || 1;
          setTournamentRound(detectedRound);
          const isComplete = status && status.type && status.type.completed === true;
          const format = isComplete ? 'final' : 'in-progress';

          const parsed = [];
          for (var i = 0; i < competitors.length; i++) {
            var comp = competitors[i];
            var name = (comp.athlete && comp.athlete.displayName) || '';
            if (!name) continue;
            var statusType = (comp.status && comp.status.type && comp.status.type.name) || '';
            var stateType  = (comp.status && comp.status.type && comp.status.type.state) || '';
            var isCut = statusType === 'STATUS_CUT' || statusType === 'cut';
            var isWD  = statusType === 'STATUS_WITHDRAWN' || statusType === 'wd';
            var hasStarted = stateType !== 'pre';
            var thruRaw = (comp.status && comp.status.thru !== undefined) ? comp.status.thru : 0;

            // Position: ESPN uses "0" for not-yet-started players
            var posId = comp.status && comp.status.position && comp.status.position.id;
            var posInt = posId ? parseInt(posId) : 0;
            var position = (hasStarted && posInt > 0) ? posInt : null;

            // Round scores from linescores - only use a round's score once that round is fully complete (18 holes)
            var linescores = comp.linescores || [];
            var rounds = [null, null, null, null];
            for (var r = 0; r < 4; r++) {
              var ls = linescores[r];
              if (ls && ls.value !== undefined && ls.value !== null && !isNaN(ls.value)) {
                var isCurrentRound = (r === detectedRound - 1);
                // For the round currently in progress, only count it complete once thru hits 18
                // For past rounds, the value is always final once it exists with a teeTime
                var roundComplete = isCurrentRound ? (thruRaw >= 18) : (ls.teeTime ? true : false);
                if (roundComplete) {
                  var rv = parseInt(ls.value);
                  if (rv > 50) rounds[r] = rv; // Sanity check: real stroke totals are 50+
                }
              }
            }

            // Score to par: use statistics[0] (scoreToPar) displayValue
            var scoreDisplay = null;
            if (isCut) { scoreDisplay = 'CUT'; }
            else if (isWD) { scoreDisplay = 'WD'; }
            else if (hasStarted) {
              var stats = comp.statistics || [];
              for (var si = 0; si < stats.length; si++) {
                if (stats[si].name === 'scoreToPar') {
                  var dv = stats[si].displayValue;
                  if (dv && dv !== '-' && dv !== '--') { scoreDisplay = dv; }
                  break;
                }
              }
            }

            var thru = hasStarted ? String(thruRaw) : null;

            // Tee time for unstarted players - format as local time
            var teeTimeDisplay = null;
            var teeTimeRaw = null;
            if (!hasStarted && comp.status && comp.status.teeTime) {
              teeTimeRaw = comp.status.teeTime;
              var tt = new Date(comp.status.teeTime);
              var hrs = tt.getHours();
              var mins = tt.getMinutes();
              var ampm = hrs >= 12 ? 'PM' : 'AM';
              hrs = hrs % 12 || 12;
              teeTimeDisplay = hrs + ':' + (mins < 10 ? '0' + mins : mins) + ' ' + ampm;
            }

            // Today's score - use the current round's linescore displayValue (relative to par for that round only)
            var todayDisplay = null;
            if (hasStarted && thruRaw > 0) {
              var currentRoundLS = linescores[detectedRound - 1];
              if (currentRoundLS && currentRoundLS.displayValue) {
                todayDisplay = currentRoundLS.displayValue;
              }
            }

            parsed.push({ name: name, position: position, rounds: rounds, score: scoreDisplay, today: todayDisplay, thru: thru, teeTime: teeTimeDisplay, teeTimeRaw: teeTimeRaw, cut: isCut || isWD });
          }

          setLiveScores(parsed);
          setLastFetch(new Date());

          if (parsed.length > 0) {
            var allGolfers = Object.values(teams).reduce(function(acc, arr) { return acc.concat(arr); }, []);
            var newScores = Object.assign({}, scores);
            for (var j = 0; j < parsed.length; j++) {
              var p = parsed[j];
              var match = null;
              for (var k = 0; k < allGolfers.length; k++) {
                if (namesMatch(allGolfers[k], p.name)) { match = allGolfers[k]; break; }
              }
              if (match) {
                var safeKey = match.replace(/[.#$\/\[\]]/g, '');
                var existing = newScores[safeKey] || {};
                var existingRounds = existing.rounds || [null, null, null, null];
                var newPos = (p.position !== null && p.position !== undefined) ? p.position : (existing.position || null);
                newScores[safeKey] = {
                  position: newPos === undefined ? null : newPos,
                  rounds: p.rounds.map(function(rv, ri) { return (rv !== null && rv !== undefined) ? rv : (existingRounds[ri] || null); }),
                  score: p.score !== undefined ? p.score : (existing.score || null),
                  today: p.today !== undefined ? p.today : (existing.today || null),
                  thru: p.thru !== undefined ? p.thru : (existing.thru || null),
                  cut: (p.cut || existing.cut) ? true : false
                };
              }
            }
            setScores(newScores);
            saveToFirebase({ scores: newScores });
            if (format === 'final') {
              var winner = null;
              for (var w = 0; w < parsed.length; w++) {
                if (parsed[w].position === 1) { winner = parsed[w]; break; }
              }
              if (winner && winner.name !== champion) {
                setChampion(winner.name);
                saveToFirebase({ champion: winner.name });
              }
            }
          }
        } catch(err) {
          setFetchError('Could not fetch scores from ESPN.');
          console.error(err);
        }
        setIsFetching(false);
      };
      
      // Auto-fetch every 2 minutes
      useEffect(() => {
        if (!draftActive && Object.values(teams).some(t => t.length > 0)) {
          fetchLiveScores();
          const interval = setInterval(fetchLiveScores, 120000);
          return () => clearInterval(interval);
        }
      }, [Object.values(teams).flat().length, draftActive]);

      // Smart parser for ESPN copy/pastes
      const parseGolferList = (rawText) => {
        const patternsToRemove = [
          /^\d+\.?\s*/, /^T?\d+\s+/, /\s*\(\d+\)\s*/g, /\s*\(-?\d+\)\s*/g,
          /\s+-\d+$/, /\s+\+\d+$/, /\s+E$/, /\s+--$/, /\s+F$/,
          /\s+\d+:\d+\s*(AM|PM)?/gi, /\s+THRU\s+\d+/gi, /\s+\d+\s+\d+\s+\d+\s+\d+/,
          /\(a\)/gi, /\s+-+\s*$/, /^\s*-+\s*/, /\bPOS\b/gi, /\bPLAYER\b/gi,
          /\bTODAY\b/gi, /\bTHRU\b/gi, /\bTO PAR\b/gi, /\bTOT\b/gi, /\bR\d\b/gi,
          /\bROUND \d\b/gi, /\bTEE TIME\b/gi, /\bSCORE\b/gi, /\bOWGR\b/gi,
          /\bFEDEX\b/gi, /\bPTS\b/gi, /\bCUT\b/gi, /\bWD\b/gi, /\bDQ\b/gi,
          /\bMDF\b/gi, /^\s*--\s*$/, /\s{2,}/g,
        ];

        const countryCodes = /\s+(USA|ENG|NIR|SCO|IRL|AUS|RSA|JPN|KOR|SWE|NOR|ESP|FRA|GER|ITA|CAN|MEX|ARG|COL|CHI|NZL|WAL|BEL|AUT|DEN|FIN|NED|POR|CHN|TPE|THA|IND|PHI)\s*$/gi;
        
        let lines = rawText.split(/[\n\r\t]+/).map(line => line.trim()).filter(line => line.length > 0);
        const golfers = [];
        const seen = new Set();

        for (let line of lines) {
          let cleaned = line.replace(countryCodes, '');
          for (const pattern of patternsToRemove) {
            cleaned = cleaned.replace(pattern, ' ');
          }
          cleaned = cleaned.replace(/\s+/g, ' ').trim();
          
          if (cleaned.length < 3) continue;
          if (/^\d+$/.test(cleaned)) continue;
          if (/^[^a-zA-Z]*$/.test(cleaned)) continue;
          
          const headers = ['player', 'pos', 'score', 'today', 'thru', 'round', 'tee time', 'total', 'earnings', 'fedex', 'points'];
          if (headers.includes(cleaned.toLowerCase())) continue;
          
          const nameParts = cleaned.split(' ').filter(p => p.length > 0);
          if (nameParts.length < 2) continue;
          
          const alphaCount = (cleaned.match(/[a-zA-ZÀ-ÿ]/g) || []).length;
          if (alphaCount < cleaned.replace(/\s/g, '').length * 0.7) continue;
          
          const normalized = nameParts.map(part => {
            if (part.toLowerCase().startsWith('mc')) {
              return 'Mc' + part.charAt(2).toUpperCase() + part.slice(3).toLowerCase();
            }
            if (part.toLowerCase().startsWith("o'")) {
              return "O'" + part.charAt(2).toUpperCase() + part.slice(3).toLowerCase();
            }
            return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
          }).join(' ');
          
          const key = normalized.toLowerCase();
          if (!seen.has(key)) {
            seen.add(key);
            golfers.push(normalized);
          }
        }
        return golfers;
      };

      const handleGolferPaste = (e) => {
        const pasted = e.target.value;
        setGolferInput(pasted);
        const parsed = parseGolferList(pasted);
        if (parsed.length > 0) {
          setParseStatus(`✓ Found ${parsed.length} golfers`);
        } else if (pasted.trim().length > 0) {
          setParseStatus('⚠ No golfers detected');
        } else {
          setParseStatus('');
        }
      };

      // Load the tournament field from The Odds API (full field, pre-sorted by win odds).
      // ESPN's leaderboard only serves the *current* live event, so it can't provide an
      // upcoming field pre-tournament — the odds feed already has the active major's field.
      const loadGolfersFromSheet = async () => {
        setIsFetching(true);
        try {
          const map = await fetchWinOdds();
          const sorted = Object.values(map).sort((a, b) => b.impliedProb - a.impliedProb).map(o => o.name);
          if (sorted.length > 0) {
            setGolferInput(sorted.join('\n'));
            setParseStatus(`✓ Loaded ${sorted.length} golfers from odds, sorted by win odds`);
            setIsFetching(false);
            return;
          }
          // Fallback: ESPN's current event (works once the tournament is live)
          const response = await fetch(espnLeaderboardUrl());
          if (!response.ok) throw new Error('ESPN API failed');
          const data = await response.json();
          const event = data && data.events && data.events[0];
          const competitors = (event && event.competitions && event.competitions[0] && event.competitions[0].competitors) || [];
          const names = [];
          for (var i = 0; i < competitors.length; i++) {
            var n = competitors[i].athlete && competitors[i].athlete.displayName;
            if (n && n.length > 2) names.push(n);
          }
          if (names.length > 0) {
            setGolferInput(names.join('\n'));
            setParseStatus(`✓ Loaded ${names.length} golfers from ESPN (no odds available)`);
          } else {
            alert('No field found from odds or ESPN. Try again shortly.');
          }
        } catch(err) {
          alert('Error loading field: ' + err.message);
          console.error(err);
        }
        setIsFetching(false);
      };

      const getTeamRoundTotal = (player, roundIndex) => {
        const golfers = teams[player] || [];
        const roundScores = golfers
          .map(g => {
            // Check both scores (Firebase) and liveScores (fresh data)
            let score = getGolferScoreFromScores(scores, g)?.rounds?.[roundIndex];
            if (score === null || score === undefined) {
              const liveMatch = liveScores.find(lg => namesMatch(lg.name, g));
              score = liveMatch?.rounds?.[roundIndex];
            }
            return score;
          })
          .filter(s => s !== null && s !== undefined)
          .sort((a, b) => a - b);
        if (roundScores.length === 0) return null;
        
        // R1 & R2 (index 0, 1): use all 8 golfers
        // R3 & R4 (index 2, 3): use best 5 of 8 (after cut)
        const countToUse = roundIndex <= 1 ? roundScores.length : Math.min(5, roundScores.length);
        const scoresToSum = roundScores.slice(0, countToUse);
        return scoresToSum.reduce((sum, s) => sum + s, 0);
      };

      // Helper to get a golfer's round score from scores or liveScores
      const getGolferRoundScore = (golfer, roundIndex) => {
        let score = getGolferScoreFromScores(scores, golfer)?.rounds?.[roundIndex];
        if (score === null || score === undefined) {
          const liveMatch = liveScores.find(g => namesMatch(g.name, golfer));
          score = liveMatch?.rounds?.[roundIndex];
        }
        return score;
      };

      const getDailyLowGolfer = (roundIndex) => {
        // Collect all golfers with their scores
        const candidates = [];
        players.forEach(player => {
          (teams[player] || []).forEach(golfer => {
            const score = getGolferRoundScore(golfer, roundIndex);
            if (score !== null && score !== undefined) {
              candidates.push({ golfer, score, owner: player });
            }
          });
        });
        
        if (candidates.length === 0) return null;
        
        // Find lowest score
        const lowScore = Math.min(...candidates.map(c => c.score));
        const tied = candidates.filter(c => c.score === lowScore);
        
        if (tied.length === 1) {
          return tied[0];
        }
        
        // Tiebreaker: lowest score in next round (R4 looks back at R3)
        const tiebreakRound = roundIndex === 3 ? 2 : roundIndex + 1;
        
        // Only apply tiebreaker if the tiebreaker round is fully complete
        if (!isRoundComplete(tiebreakRound)) {
          return { ...tied[0], tied: true, tiedWith: tied.map(c => c.golfer) };
        }
        
        let bestTiebreak = Infinity;
        let winner = tied[0];
        tied.forEach(c => {
          const tiebreakScore = getGolferRoundScore(c.golfer, tiebreakRound);
          if (tiebreakScore !== null && tiebreakScore !== undefined && tiebreakScore < bestTiebreak) {
            bestTiebreak = tiebreakScore;
            winner = c;
          }
        });
        return winner;
      };

      const getDailyLowTeam = (roundIndex) => {
        // Collect all teams with their totals
        const candidates = [];
        players.forEach(player => {
          // For R3 & R4, team must have 5+ survivors (made the cut) to be eligible
          if (roundIndex >= 2) {
            const golfers = teams[player] || [];
            const survivors = golfers.filter(g => {
              const data = getGolferScoreFromScores(scores, g);
              return data?.position !== null && data?.position !== undefined && !data?.cut;
            }).length;
            if (survivors < 5) return;
          }
          const total = getTeamRoundTotal(player, roundIndex);
          if (total !== null) {
            candidates.push({ player, total });
          }
        });
        
        if (candidates.length === 0) return null;
        
        // Find lowest total
        const lowTotal = Math.min(...candidates.map(c => c.total));
        const tied = candidates.filter(c => c.total === lowTotal);
        
        if (tied.length === 1) {
          return tied[0];
        }
        
        // Tiebreaker round: R1→R2, R2→R1, R3→R4, R4→R3
        const tiebreakRound = roundIndex === 0 ? 1 :
                              roundIndex === 1 ? 0 :
                              roundIndex === 2 ? 3 :
                              2;
        
        // Only apply tiebreaker if the tiebreaker round is fully complete
        if (!isRoundComplete(tiebreakRound)) {
          return { ...tied[0], tied: true, tiedWith: tied.map(c => c.player) };
        }
        
        let bestTiebreak = Infinity;
        let winner = tied[0];
        tied.forEach(c => {
          const tiebreakTotal = getTeamRoundTotal(c.player, tiebreakRound);
          if (tiebreakTotal !== null && tiebreakTotal < bestTiebreak) {
            bestTiebreak = tiebreakTotal;
            winner = c;
          }
        });
        return winner;
      };

      const getFinalStandings = () => {
        const standings = players.map(player => {
          const golfers = teams[player] || [];
          const positions = golfers
            .map(g => getGolferScoreFromScores(scores, g)?.position)
            .filter(p => p !== null && p !== undefined)
            .sort((a, b) => a - b);
          // Count survivors - only apply cut logic after R2 is complete
          const r2done = isRoundComplete(1);
          const survivors = golfers.filter(g => {
            const data = getGolferScoreFromScores(scores, g);
            if (!r2done) return true; // Before cut is determined, everyone survives
            return data && data.position !== null && data.position !== undefined && !data.cut;
          }).length;
          const eligible = !r2done || survivors >= 5; // Always eligible before cut
          const best5 = positions.slice(0, Math.min(5, positions.length));
          const total = best5.reduce((sum, p) => sum + p, 0);
          return { player, total, positions: best5, survivors, eligible };
        }).sort((a, b) => {
          // Ineligible teams go to bottom
          if (a.eligible && !b.eligible) return -1;
          if (!a.eligible && b.eligible) return 1;
          return a.total - b.total;
        });
        return standings;
      };

      const calculatePayouts = (completedRounds = [false, false, false, false]) => {
        const payouts = {};
        players.forEach(p => payouts[p] = 0);
        
        // Only award daily payouts for completed rounds
        ROUNDS.forEach((_, i) => {
          if (!completedRounds[i]) return; // Skip incomplete rounds
          const low = getDailyLowGolfer(i);
          if (low) payouts[low.owner] += 30;
        });
        
        ROUNDS.forEach((_, i) => {
          if (!completedRounds[i]) return; // Skip incomplete rounds
          const low = getDailyLowTeam(i);
          if (low) payouts[low.player] += 30;
        });
        
        // Only award champion and overall winner after tournament is over (R4 complete)
        if (completedRounds[3]) {
          if (champion) {
            const owner = players.find(p => (teams[p] || []).some(g => namesMatch(g, champion)));
            if (owner) payouts[owner] += 30;
          }
          
          const standings = getFinalStandings();
          const eligibleStandings = standings.filter(s => s.eligible);
          if (eligibleStandings[0] && eligibleStandings[0].total > 0) {
            payouts[eligibleStandings[0].player] += 150;
          }
        }
        
        return payouts;
      };

      const updateScore = (golfer, roundIndex, value) => {
        const newScores = {
          ...scores,
          [golfer]: {
            ...scores[golfer],
            rounds: (scores[golfer]?.rounds || [null, null, null, null]).map((r, i) => 
              i === roundIndex ? (value === '' ? null : parseInt(value)) : r
            )
          }
        };
        setScores(newScores);
        saveToFirebase({ scores: newScores });
      };

      const updatePosition = (golfer, value) => {
        const newScores = {
          ...scores,
          [golfer]: {
            ...scores[golfer],
            position: value === '' ? null : parseInt(value)
          }
        };
        setScores(newScores);
        saveToFirebase({ scores: newScores });
      };

      const toggleCut = (golfer) => {
        const newScores = {
          ...scores,
          [golfer]: {
            ...scores[golfer],
            cut: !scores[golfer]?.cut
          }
        };
        setScores(newScores);
        saveToFirebase({ scores: newScores });
      };

      // ---- Derived draft state (single source of truth = the pick log) ----
      const draftedGolfers = picks.map(p => p.golfer);
      const availableGolfers = draftField.filter(g => !draftedGolfers.includes(g));
      const currentPickIndex = picks.length;
      const currentManager = draftOrder[currentPickIndex] || null;
      const draftComplete = draftOrder.length > 0 && currentPickIndex >= draftOrder.length;
      const derivedTeams = (() => {
        const t = {}; players.forEach(p => t[p] = []);
        picks.forEach(p => { if (t[p.manager]) t[p.manager].push(p.golfer); });
        return t;
      })();

      const startDraft = () => {
        const golfers = parseGolferList(golferInput);
        if (golfers.length < players.length * ROSTER_SIZE) {
          alert(`Need at least ${players.length * ROSTER_SIZE} golfers for the draft.`);
          return;
        }
        const orderPlayers = draftOrderInput.split(',').map(p => p.trim().toUpperCase()).filter(p => players.includes(p));
        if (orderPlayers.length !== players.length) {
          alert('Draft order must include all players');
          return;
        }
        const snakeOrder = generateSnakeOrder(orderPlayers);
        // Clear teams/scores for a fresh draft, then stand up the pick log
        saveToFirebase({ teams: {}, scores: {}, champion: null });
        database.ref('game/draft').set({ active: true, order: snakeOrder, field: golfers, picks: {} });
        setView('draft');
      };

      // Finalize once the last pick lands (only the client that committed it runs this)
      const finalizeDraft = (picksObj) => {
        const t = {}; players.forEach(p => t[p] = []);
        Object.values(picksObj).filter(Boolean).sort((a, b) => a.n - b.n)
          .forEach(p => { if (t[p.manager]) t[p.manager].push(p.golfer); });
        saveToFirebase({ teams: t });
        database.ref('game/draft/active').set(false);
      };

      // Confirm a pick — a Firebase transaction guarantees no double-picks or turn-jumps
      const confirmPick = (golfer) => {
        const me = myIdentity;
        const expectedN = picks.length;
        database.ref('game/draft/picks').transaction((current) => {
          const cur = current || {};
          const count = Object.keys(cur).length;
          if (count !== expectedN) return;                  // board already moved — abort
          if ((draftOrder[count] || null) !== me) return;   // not your turn — abort
          if (Object.values(cur).some(p => p && p.golfer === golfer)) return; // already taken — abort
          cur[count] = { n: count, manager: me, golfer, ts: Date.now() };
          return cur;
        }, (err, committed, snap) => {
          setPendingPick(null);
          setSearchTerm('');
          if (err) { alert('Pick error: ' + err.message); return; }
          if (!committed) { alert("That pick didn't go through — the board moved or that golfer was already taken. Your screen will refresh automatically."); return; }
          const val = (snap && snap.val()) || {};
          if (Object.keys(val).length >= draftOrder.length) finalizeDraft(val);
        });
      };

      // Commissioner-only: rewind to pick n (removes pick n and everything after it)
      const rewindTo = (n) => {
        if (!isCommissioner) return;
        database.ref('game/draft/picks').transaction((current) => {
          const cur = current || {};
          Object.keys(cur).forEach(k => { if (parseInt(k, 10) >= n) delete cur[k]; });
          return cur;
        }, (err) => {
          if (err) { alert('Undo error: ' + err.message); return; }
          database.ref('game/draft/active').set(true); // back on the clock
        });
      };
      const undoLastPick = () => { if (picks.length > 0) rewindTo(picks.length - 1); };

      // Check if a round is complete — all golfers in liveScores must have thru='F' for that round
      const isRoundComplete = (roundIndex) => {
        if (liveScores.length === 0) return false;
        // Round is complete if all golfers have a score for that round
        // We detect this by checking if thru='F' for all golfers (when roundIndex matches current round)
        // OR if all golfers have a non-null score for that round (for past rounds)
        const currentRoundIndex = tournamentRound - 1;
        if (roundIndex < currentRoundIndex) {
          // Past round — complete if majority of golfers have a real stroke score (>50) for that round
          const withScores = liveScores.filter(g => g.rounds && g.rounds[roundIndex] !== null && g.rounds[roundIndex] !== undefined && g.rounds[roundIndex] > 50);
          return withScores.length > liveScores.length * 0.8; // 80%+ have scores = round complete
        }
        if (roundIndex === currentRoundIndex) {
          // Current round — complete only if all golfers show thru='F'
          return liveScores.every(g => g.thru === 'F');
        }
        return false; // Future round
      };
      const standings = getFinalStandings();

      // Draft Setup View
      const DraftSetupView = () => {
        const parsedCount = parseGolferList(golferInput).length;
        
        return (
          <div className="space-y-4">
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
              <h3 className="font-bold text-gray-800 mb-2">🙋 This device</h3>
              <p className="text-xs text-gray-500 mb-2">Set who's drafting here so the app can confirm your picks. Stays on this device.</p>
              <div className="grid grid-cols-3 gap-2">
                {players.map(p => (
                  <button key={p} onClick={() => setMyIdentity(p)}
                    className={`py-2 rounded-lg text-sm font-bold transition-colors ${myIdentity === p ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                    {p}{p === COMMISSIONER ? ' 👑' : ''}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
              <h3 className="font-bold text-gray-800 mb-2">📋 Tournament Field</h3>
              
              <button
                onClick={loadGolfersFromSheet}
                disabled={isFetching}
                className="w-full mb-3 py-3 bg-gradient-to-r from-emerald-600 to-emerald-700 text-white font-bold rounded-lg hover:from-emerald-700 hover:to-emerald-800 transition-all disabled:opacity-50"
              >
                {isFetching ? '⏳ Loading field...' : `⚡ Load ${detectedEvent?.name || 'Upcoming Tournament'} Field`}
              </button>
              {oddsStatus && <p className="text-xs text-gray-500 text-center mb-3">{oddsStatus}</p>}
              
              <p className="text-sm text-gray-500 mb-2">Or paste manually:</p>
              <textarea
                value={golferInput}
                onChange={handleGolferPaste}
                placeholder="Click the button above to load golfers, or paste a list here"
                className="w-full h-36 border border-gray-200 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-emerald-500"
              />
              <div className="flex justify-between items-center mt-2">
                <p className={`text-sm font-medium ${parsedCount > 0 ? 'text-emerald-600' : 'text-gray-400'}`}>
                  {parseStatus || `${parsedCount} golfers detected`}
                </p>
                {parsedCount > 0 && (
                  <button
                    onClick={() => {
                      const parsed = parseGolferList(golferInput);
                      // Show with odds when available
                      const preview = parsed.slice(0, 20).map(name => {
                        const o = getGolferOdds(name);
                        return o ? `${name} (${fmtOdds(o.price)})` : name;
                      });
                      alert(`Detected golfers:\n\n${preview.join('\n')}${parsed.length > 20 ? `\n... and ${parsed.length - 20} more` : ''}`);
                    }}
                    className="text-sm text-blue-600 hover:text-blue-800"
                  >
                    Preview list →
                  </button>
                )}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
              <h3 className="font-bold text-gray-800 mb-3">🎯 Draft Order</h3>
              <p className="text-sm text-gray-500 mb-2">Enter names in pick order (comma-separated)</p>

      // Live Draft View

        const pickInRound = (currentPickIndex % players.length) + 1;
        const isMyTurn = currentManager === myIdentity && !draftComplete;

        return (
          <div className="space-y-4">
            {/* Status banner */}
            <div className={`rounded-xl p-4 text-white shadow-lg ${isMyTurn ? 'bg-gradient-to-r from-emerald-500 to-emerald-600' : 'bg-gradient-to-r from-slate-500 to-slate-600'}`}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-sm opacity-80">Round {pickRound}, Pick {pickInRound} · #{currentPickIndex + 1} of {draftOrder.length}</div>
                  <div className="text-2xl font-bold">

                  </div>

      // Dashboard View
      const DashboardView = () => {
        const hasTeams = Object.values(teams).some(t => t.length > 0);
        
        if (!hasTeams) {

            <div className="text-center py-12">

              <button

              >
                🚀 Start New Draft

            </div>

        return (
          <div className="space-y-6">
            {/* Cut Line Alert during R2 */}
            {cutLine && tournamentRound === 2 && (
              <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center gap-2">
                <span className="text-amber-600">✂️</span>
                <span className="text-amber-800 font-medium">Projected Cut: {cutLine}</span>
              </div>
            )}
            
            {/* Live Score Status */}
            <div className="flex items-center justify-between bg-white rounded-xl p-3 shadow-sm border border-gray-100">
              <div className="text-sm">
                {isFetching ? (
                  <span className="text-blue-600">⏳ Updating scores...</span>
                ) : lastFetch ? (
                  <span className="text-gray-600">Updated: {lastFetch.toLocaleTimeString()}</span>
                ) : (
                  <span className="text-gray-400">Live scores connected</span>
                )}
              </div>
              <button
                onClick={fetchLiveScores}
                disabled={isFetching}
                className="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-sm font-medium hover:bg-emerald-200 transition-colors disabled:opacity-50"
              >
                🔄 Refresh
              </button>
            </div>
            
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {ROUNDS.map((round, i) => {
                const lowGolfer = getDailyLowGolfer(i);
                const lowTeam = getDailyLowTeam(i);
                
                // Round is complete when 95%+ of relevant golfers have a value in that round column
                // For R1/R2: all golfers should have scores
                // For R3/R4: only non-cut golfers need scores
                const isComplete = liveScores.length > 0 && (() => {
                  const relevantGolfers = i >= 2 
                    ? liveScores.filter(g => !g.cut) // R3/R4: exclude cut players
                    : liveScores; // R1/R2: all players
                  
                  if (relevantGolfers.length === 0) return false;
                  
                  const withScores = relevantGolfers.filter(g => {
                    const roundScore = g.rounds?.[i];
                    return roundScore !== null && roundScore !== undefined;
                  }).length;
                  
                  // 95% threshold to handle WDs
                  return withScores / relevantGolfers.length >= 0.95;
                })();
                
                const isInProgress = !isComplete && (i + 1) === tournamentRound;
                const isUpcoming = (i + 1) > tournamentRound;
                
                return (
                  <div key={round} className={`rounded-xl p-4 shadow-sm border ${
                    isComplete ? 'bg-emerald-50 border-emerald-200' :
                    isInProgress ? 'bg-amber-50 border-amber-200' :
                    'bg-white border-gray-100'
                  }`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs text-gray-500 font-medium">{round}</span>
                      {isComplete && <span className="text-xs text-emerald-600 font-medium">✓ Final</span>}
                      {isInProgress && <span className="text-xs text-amber-600 font-medium">● Live</span>}
                    </div>
                    {isUpcoming ? (
                      <div className="text-sm text-gray-400">Upcoming</div>
                    ) : (
                      <>
                        <div className="text-sm">
                          <span className="text-gray-600">Low:</span>{' '}
                          <span className="font-semibold text-emerald-600">{lowGolfer ? `${lowGolfer.score}` : '—'}</span>
                        </div>
                        <div className="text-xs text-gray-500 truncate">{lowGolfer ? `${lowGolfer.golfer} (${lowGolfer.owner})` : ''}</div>
                        <div className="text-xs text-gray-500 mt-1">Team: {lowTeam ? `${lowTeam.player} (${lowTeam.total})` : '—'}</div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Today's Leaders - Top 8 lowest scores for current round */}
            {tournamentRound > 0 && liveScores.length > 0 && (
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="bg-gradient-to-r from-blue-600 to-blue-700 px-4 py-3">
                  <h2 className="text-white font-bold">📊 Today's Leaders (Round {tournamentRound})</h2>
                </div>
                <div className="divide-y divide-gray-100">
                  {(() => {
                    // Build lookup for which team owns each golfer
                    const golferOwners = {};
                    players.forEach(player => {
                      (teams[player] || []).forEach(golfer => {
                        golferOwners[golfer.toLowerCase()] = player;
                      });
                    });
                    
                    const TEAM_COLORS_LOCAL = {
                      ROBERTS: { bg: 'bg-purple-100', border: 'border-purple-400', text: 'text-purple-700', dot: 'bg-purple-500' },
                      CRAIG: { bg: 'bg-orange-100', border: 'border-orange-400', text: 'text-orange-700', dot: 'bg-orange-500' },
                      SIEVE: { bg: 'bg-yellow-100', border: 'border-yellow-400', text: 'text-yellow-700', dot: 'bg-yellow-500' },
                      WEILER: { bg: 'bg-blue-100', border: 'border-blue-400', text: 'text-blue-700', dot: 'bg-blue-500' },
                      PALMER: { bg: 'bg-teal-100', border: 'border-teal-400', text: 'text-teal-700', dot: 'bg-teal-500' },
                      RED: { bg: 'bg-red-100', border: 'border-red-400', text: 'text-red-700', dot: 'bg-red-500' },
                    };
                    
                    // Sort by today's score and get top 8
                    const todayLeaders = [...liveScores]
                      .filter(g => g.today && g.today !== '-' && g.today !== '')
                      .sort((a, b) => {
                        const scoreA = a.today === 'E' ? 0 : parseInt(a.today);
                        const scoreB = b.today === 'E' ? 0 : parseInt(b.today);
                        return scoreA - scoreB;
                      })
                      .slice(0, 8);
                    
                    return todayLeaders.map((golfer, i) => {
                      const ownerKey = Object.keys(golferOwners).find(key => namesMatch(golfer.name, key));
                      const owner = ownerKey ? golferOwners[ownerKey] : null;
                      const colors = owner ? TEAM_COLORS_LOCAL[owner] : null;
                      
                      return (
                        <div 
                          key={golfer.name} 
                          className={`flex items-center justify-between px-4 py-2 ${colors ? colors.bg + ' border-l-4 ' + colors.border : ''}`}
                        >
                          <div className="flex items-center gap-2">
                            <span className="text-sm text-gray-500 w-4">{i + 1}.</span>
                            {colors && <div className={`w-2 h-2 rounded-full ${colors.dot}`} />}
                            <span className={`font-medium text-sm ${colors ? colors.text : 'text-gray-700'}`}>
                              {golfer.name}
                            </span>
                          </div>
                          <div className="flex items-center gap-4">
                            <span className={`text-sm font-bold ${
                              golfer.today?.startsWith('-') ? 'text-red-600' :
                              golfer.today?.startsWith('+') ? 'text-blue-600' :
                              golfer.today === 'E' ? 'text-gray-600' :
                              'text-gray-400'
                            }`}>
                              {golfer.today}
                            </span>
                            <span className="text-xs text-gray-500 w-12 text-right">
                              {golfer.thru || '—'}
                            </span>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            )}

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="bg-gradient-to-r from-emerald-600 to-emerald-700 px-4 py-3">
                <h2 className="text-white font-bold">Team Standings</h2>
              </div>
              <div className="divide-y divide-gray-100">
                {standings.map((s, i) => (
                  <div key={s.player} className={`flex items-center justify-between px-4 py-3 ${i === 0 && s.eligible ? 'bg-amber-50' : s.eligible ? '' : 'bg-red-50'}`}>
                    <div className="flex items-center gap-3">
                      <span className="text-sm text-gray-500 w-4">{s.eligible ? `${i + 1}.` : '—'}</span>
                      <span className={`font-semibold ${s.eligible ? 'text-gray-800' : 'text-gray-400'}`}>{s.player}</span>
                      {!s.eligible && (
                        <span className="text-xs bg-red-100 text-red-600 font-medium px-1.5 py-0.5 rounded">DQ ({s.survivors} left)</span>
                      )}
                    </div>
                    <div className="text-right">
                      <div className={`font-bold ${s.eligible ? 'text-gray-800' : 'text-gray-400'}`}>{s.total || '—'}</div>
                      <div className="text-xs text-gray-500">pos total</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="bg-gradient-to-r from-green-600 to-green-700 px-4 py-3">
                <h2 className="text-white font-bold">💰 Payouts</h2>
              </div>
              
              {/* Check if any rounds are complete (have final scores) */}
              {(() => {
                // A round is complete when 95%+ of relevant golfers have a value in that round column
                // For R1/R2: all golfers; For R3/R4: only non-cut golfers
                const isRoundComplete = (roundIndex) => {
                  if (liveScores.length === 0) return false;
                  
                  const relevantGolfers = roundIndex >= 2 
                    ? liveScores.filter(g => !g.cut) // R3/R4: exclude cut players
                    : liveScores; // R1/R2: all players
                  
                  if (relevantGolfers.length === 0) return false;
                  
                  const withScores = relevantGolfers.filter(g => {
                    const roundScore = g.rounds?.[roundIndex];
                    return roundScore !== null && roundScore !== undefined;
                  }).length;
                  
                  // 95% threshold to handle WDs
                  return withScores / relevantGolfers.length >= 0.95;
                };
                
                const completedRounds = ROUNDS.map((_, i) => isRoundComplete(i));
                const anyComplete = completedRounds.some(c => c);
                const tournamentOver = completedRounds[3]; // R4 complete
                
                // Recalculate payouts with completed rounds info
                const currentPayouts = calculatePayouts(completedRounds);
                
                if (!anyComplete) {
                  return (
                    <div className="px-4 py-8 text-center">
                      <div className="text-4xl mb-2">⏳</div>
                      <div className="text-gray-500">Payouts will appear after rounds complete</div>
                      <div className="text-xs text-gray-400 mt-1">Round {tournamentRound} in progress...</div>
                    </div>
                  );
                }
                
                return (
                  <div className="divide-y divide-gray-100">
                    {/* Daily Winners */}
                    <div className="px-4 py-3">
                      <div className="text-xs text-gray-500 font-medium mb-2">DAILY WINNERS ($30 each)</div>
                      {ROUNDS.map((round, i) => {
                        if (!completedRounds[i]) return null;
                        const lowGolfer = getDailyLowGolfer(i);
                        const lowTeam = getDailyLowTeam(i);
                        return (
                          <div key={round} className="text-sm mb-2">
                            <div className="font-medium text-gray-700">{round}:</div>
                            <div className="ml-3 text-gray-600">
                              🏌️ Low Golfer: {lowGolfer ? `${lowGolfer.golfer} (${lowGolfer.score}) → ${lowGolfer.owner}` : '—'}
                            </div>
                            <div className="ml-3 text-gray-600">
                              👥 Low Team: {lowTeam ? `${lowTeam.player} (${lowTeam.total})` : '—'}
                            </div>
                          </div>

                      })}

                    {/* Tournament Winner - only if R4 complete */}
                    {tournamentOver && (
                      <div className="px-4 py-3">
                        <div className="text-xs text-gray-500 font-medium mb-2">TOURNAMENT WINNER</div>
                        <div className="text-sm">
                          🏆 Champion Bonus ($30): {champion ? `${champion} → ${players.find(p => (teams[p] || []).some(g => namesMatch(g, champion))) || '—'}` : 'TBD'}
                        </div>
                        <div className="text-sm mt-1">
                          🥇 Overall Winner ($150): {standings.find(s => s.eligible)?.player || 'TBD'}
                        </div>
                      </div>
                    )}
                    
                    {/* Current Totals - only show positive winnings */}
                    <div className="px-4 py-3">
                      <div className="text-xs text-gray-500 font-medium mb-2">NET PROFIT/LOSS (after $70 buy-in)</div>
                      {players.map(player => {
                        const winnings = currentPayouts[player];
                        const net = winnings - ENTRY_FEE; // Subtract $70 buy-in
                        return (
                          <div key={player} className="flex items-center justify-between py-1">
                            <span className="font-medium text-gray-700">{player}</span>
